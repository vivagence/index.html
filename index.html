<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vivagence — Funnel de Vente</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Serif+Display:ital@0;1&display=swap');

:root {
  --noir: #1A1A1A;
  --orange: #E8621A;
  --orange-pale: #FDF0E8;
  --orange-mid: #F5A97A;
  --blanc: #FFFFFF;
  --gris-bg: #F7F6F3;
  --gris-card: #FFFFFF;
  --gris-border: #E8E6E0;
  --gris-text: #5A5A5A;
  --gris-muted: #9A9A9A;

  --p0: #2C2C2C;
  --p1: #1A3B6B;
  --p2: #1A5C34;
  --p3: #4A2080;
  --p4: #E8621A;
  --p5: #C0180C;
  --p6: #0A5C50;
}

* { margin:0; padding:0; box-sizing:border-box; }
html, body { height:100%; }

body {
  font-family: 'DM Sans', system-ui, sans-serif;
  background: var(--gris-bg);
  color: var(--noir);
  font-size: 13px;
  line-height: 1.5;
}

/* ── HEADER ─────────────────────────────────────────── */
.hdr {
  background: var(--noir);
  height: 58px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 28px;
  position: sticky;
  top: 0;
  z-index: 200;
  border-bottom: 2px solid var(--orange);
}

/* SVG logo inline */
.logo-wrap {
  display: flex;
  align-items: center;
  gap: 0;
  text-decoration: none;
  user-select: none;
}
.logo-text {
  font-family: 'DM Sans', sans-serif;
  font-size: 22px;
  font-weight: 700;
  color: var(--blanc);
  letter-spacing: -0.5px;
}
.logo-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--orange);
  margin-left: 1px;
  margin-bottom: 2px;
  flex-shrink: 0;
}
.logo-tagline {
  font-size: 9px;
  font-weight: 500;
  letter-spacing: 2.5px;
  text-transform: uppercase;
  color: rgba(255,255,255,0.38);
  margin-left: 18px;
  padding-left: 18px;
  border-left: 1px solid rgba(255,255,255,0.15);
}

.hdr-right {
  display: flex;
  align-items: center;
  gap: 12px;
}
.hdr-badge {
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 1.8px;
  text-transform: uppercase;
  color: rgba(255,255,255,0.3);
  border: 1px solid rgba(255,255,255,0.12);
  padding: 4px 10px;
  border-radius: 2px;
}
.hdr-doc {
  font-size: 10px;
  color: rgba(255,255,255,0.22);
  letter-spacing: 0.5px;
}

/* ── SECTOR BAR ─────────────────────────────────────── */
.sector-bar {
  background: var(--blanc);
  border-bottom: 1px solid var(--gris-border);
  padding: 0 24px;
  display: flex;
  align-items: center;
  gap: 4px;
  overflow-x: auto;
  height: 46px;
  scrollbar-width: none;
}
.sector-bar::-webkit-scrollbar { display:none; }
.sector-bar .slbl {
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--gris-muted);
  white-space: nowrap;
  margin-right: 6px;
  flex-shrink: 0;
}
.sec-btn {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.3px;
  padding: 5px 13px;
  border: 1.5px solid var(--gris-border);
  background: transparent;
  color: var(--gris-text);
  cursor: pointer;
  border-radius: 2px;
  white-space: nowrap;
  flex-shrink: 0;
  transition: all 0.14s;
  font-family: 'DM Sans', sans-serif;
}
.sec-btn:hover { border-color: var(--orange); color: var(--orange); }
.sec-btn.active {
  background: var(--orange);
  color: var(--blanc);
  border-color: var(--orange);
}

/* ── LAYOUT ─────────────────────────────────────────── */
.main {
  display: flex;
  height: calc(100vh - 104px);
  overflow: hidden;
}

/* ── PHASE NAV ──────────────────────────────────────── */
.phase-nav {
  width: 188px;
  flex-shrink: 0;
  background: var(--noir);
  overflow-y: auto;
  padding: 10px 0;
  scrollbar-width: thin;
  scrollbar-color: #333 transparent;
}
.pnav-item {
  padding: 11px 18px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 10px;
  border-left: 3px solid transparent;
  transition: all 0.13s;
}
.pnav-item:hover { background: rgba(255,255,255,0.05); }
.pnav-item.active {
  background: rgba(232,98,26,0.1);
  border-left-color: var(--orange);
}
.pnav-dot {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 700;
  color: white;
  flex-shrink: 0;
}
.pnav-lbl {
  font-size: 11px;
  font-weight: 500;
  color: rgba(255,255,255,0.55);
  line-height: 1.3;
  letter-spacing: 0.2px;
}
.pnav-item.active .pnav-lbl { color: rgba(255,255,255,0.9); }
.pnav-sep {
  width: 1px;
  height: 14px;
  background: rgba(255,255,255,0.08);
  margin: 0 0 0 30px;
}

/* ── FUNNEL SIDEBAR ─────────────────────────────────── */
.funnel-side {
  width: 210px;
  flex-shrink: 0;
  background: #F0EEE8;
  border-right: 1px solid var(--gris-border);
  overflow-y: auto;
  padding: 16px 12px;
}
.side-title {
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 2.5px;
  text-transform: uppercase;
  color: var(--gris-muted);
  margin-bottom: 12px;
}
.fl {
  margin-bottom: 2px;
  cursor: pointer;
}
.fl:hover .fb { filter: brightness(1.1); }
.fb {
  border-radius: 2px;
  padding: 7px 10px;
  font-size: 11px;
  font-weight: 700;
  color: white;
  display: flex;
  align-items: center;
  gap: 6px;
  transition: filter 0.12s;
}
.fb .fn { font-size: 16px; font-weight: 800; }
.fb .ft { font-size: 9px; letter-spacing: 0.3px; opacity: 0.9; }
.fpct {
  font-size: 10px;
  color: var(--gris-muted);
  padding: 2px 10px 5px;
}
.farr {
  text-align: center;
  font-size: 10px;
  color: var(--gris-border);
  margin: 1px 0;
}

.conv-block { margin-top: 18px; }
.conv-row {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 3px 4px;
  margin-bottom: 3px;
}
.conv-d {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  flex-shrink: 0;
}
.conv-lbl { font-size: 11px; color: var(--gris-muted); flex: 1; }
.conv-v { font-size: 12px; font-weight: 700; }

/* ── CONTENT ─────────────────────────────────────────── */
.content {
  flex: 1;
  overflow-y: auto;
  padding: 20px 24px;
  scrollbar-width: thin;
  scrollbar-color: #ddd transparent;
}

.phase-pane { display: none; }
.phase-pane.on {
  display: block;
  animation: fadeUp 0.22s ease;
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ── PHASE HEADER ──────────────────────────────────── */
.ph-hdr {
  display: flex;
  align-items: center;
  gap: 14px;
  padding-bottom: 14px;
  margin-bottom: 18px;
  border-bottom: 1px solid var(--gris-border);
}
.ph-num {
  width: 50px;
  height: 50px;
  border-radius: 4px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  font-weight: 800;
  color: white;
  flex-shrink: 0;
}
.ph-title {
  font-size: 19px;
  font-weight: 700;
  color: var(--noir);
  font-family: 'DM Serif Display', serif;
}
.ph-sub {
  font-size: 12px;
  color: var(--gris-muted);
  margin-top: 2px;
  font-style: italic;
}
.ph-timing {
  margin-left: auto;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1px;
  padding: 5px 12px;
  border-radius: 2px;
  flex-shrink: 0;
}

/* ── AUDIO DEMO BLOCK ──────────────────────────────── */
.audio-block {
  background: var(--noir);
  border-radius: 6px;
  padding: 16px 18px;
  margin-bottom: 16px;
  display: flex;
  flex-direction: column;
  gap: 0;
  border-left: 4px solid var(--orange);
  border: 1px solid #333;
  border-left: 4px solid var(--orange);
}
.audio-icon {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: var(--orange);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  cursor: pointer;
  transition: transform 0.12s;
}
.audio-icon:hover { transform: scale(1.08); }
.audio-icon svg { width: 18px; height: 18px; fill: white; }
.audio-info { flex: 1; }
.audio-title {
  font-size: 13px;
  font-weight: 600;
  color: white;
  margin-bottom: 3px;
}
.audio-sub {
  font-size: 11px;
  color: rgba(255,255,255,0.45);
}
.audio-wave {
  display: flex;
  align-items: center;
  gap: 3px;
  height: 28px;
}
.audio-wave span {
  width: 3px;
  background: var(--orange);
  border-radius: 2px;
  opacity: 0.3;
  animation: none;
}
.audio-wave.playing span { opacity: 1; }
.audio-wave span:nth-child(1) { height: 8px; }
.audio-wave span:nth-child(2) { height: 18px; }
.audio-wave span:nth-child(3) { height: 26px; }
.audio-wave span:nth-child(4) { height: 14px; }
.audio-wave span:nth-child(5) { height: 20px; }
.audio-wave span:nth-child(6) { height: 10px; }
.audio-wave span:nth-child(7) { height: 22px; }
.audio-wave span:nth-child(8) { height: 16px; }
@keyframes waveBounce {
  0%,100% { transform: scaleY(1); }
  50% { transform: scaleY(0.4); }
}
.audio-wave.playing span:nth-child(1) { animation: waveBounce 0.8s ease infinite 0.0s; }
.audio-wave.playing span:nth-child(2) { animation: waveBounce 0.8s ease infinite 0.1s; }
.audio-wave.playing span:nth-child(3) { animation: waveBounce 0.8s ease infinite 0.2s; }
.audio-wave.playing span:nth-child(4) { animation: waveBounce 0.8s ease infinite 0.3s; }
.audio-wave.playing span:nth-child(5) { animation: waveBounce 0.8s ease infinite 0.15s; }
.audio-wave.playing span:nth-child(6) { animation: waveBounce 0.8s ease infinite 0.25s; }
.audio-wave.playing span:nth-child(7) { animation: waveBounce 0.8s ease infinite 0.05s; }
.audio-wave.playing span:nth-child(8) { animation: waveBounce 0.8s ease infinite 0.35s; }
.audio-gen-btn {
  background: var(--orange);
  color: white;
  border: none;
  border-radius: 3px;
  padding: 8px 16px;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  font-family: 'DM Sans', sans-serif;
  letter-spacing: 0.5px;
  white-space: nowrap;
  transition: all 0.15s;
  min-width: 140px;
  text-align: center;
}
.audio-gen-btn:hover { background: #D4541A; transform: translateY(-1px); }
.audio-gen-btn:active { transform: translateY(0); }
.audio-gen-btn:disabled { opacity: 0.4; cursor: default; transform: none; }
.audio-status {
  font-size: 11px;
  color: rgba(255,255,255,0.4);
  margin-top: 4px;
}
.audio-player-wrap { margin-top: 8px; }
.audio-player-wrap audio { width: 100%; height: 32px; }

/* ── CONTENT BLOCKS ─────────────────────────────────── */
.blk { margin-bottom: 14px; }
.blk-title {
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 2.5px;
  text-transform: uppercase;
  color: var(--gris-muted);
  margin-bottom: 8px;
}

.script-box {
  border-radius: 4px;
  padding: 14px 18px;
  margin-bottom: 10px;
  border-left: 4px solid;
  position: relative;
}
.script-box .qm {
  font-size: 28px;
  line-height: 0.8;
  margin-bottom: 6px;
  opacity: 0.45;
  font-family: 'DM Serif Display', serif;
}
.script-box p {
  font-style: italic;
  line-height: 1.7;
  font-size: 13px;
}
.script-box .slbl {
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  margin-bottom: 6px;
}

.row2-wrap { width: 100%; margin-bottom: 10px; border-radius: 4px; overflow: hidden; border: 1px solid var(--gris-border); }
.row2 { display: grid; grid-template-columns: 160px 1fr; }
.row2-label {
  padding: 10px 12px;
  font-size: 10px;
  font-weight: 700;
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  line-height: 1.3;
  letter-spacing: 0.5px;
  text-transform: uppercase;
}
.row2-val {
  padding: 10px 14px;
  font-size: 13px;
  line-height: 1.6;
}
.row2 + .row2 { border-top: 1px solid var(--gris-border); }

.oui-grid {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 6px;
  margin-bottom: 10px;
}
.oui-card {
  border-radius: 4px;
  padding: 12px;
  text-align: center;
}
.oui-n { font-size: 9px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; opacity: 0.7; margin-bottom: 4px; }
.oui-t { font-size: 12px; font-style: italic; line-height: 1.4; }

.branch-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 10px; }
.branch {
  border-radius: 4px;
  padding: 12px;
  border: 1.5px solid;
}
.b-tag { font-size: 9px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 5px; }
.b-trigger { font-size: 12px; font-style: italic; color: var(--gris-text); margin-bottom: 7px; line-height: 1.4; }
.b-action { font-size: 12px; line-height: 1.5; }
.b-next { font-size: 9px; font-weight: 700; margin-top: 7px; padding: 3px 7px; border-radius: 2px; display: inline-block; color: white; }

.cap-block { margin-bottom: 10px; border-radius: 4px; overflow: hidden; border: 1px solid var(--gris-border); }
.cap-row { display: grid; grid-template-columns: 130px 1fr; }
.cap-row + .cap-row { border-top: 1px solid var(--gris-border); }
.cap-lbl { padding: 10px 12px; font-size: 9px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; color: white; display: flex; align-items: center; }
.cap-val { padding: 10px 14px; font-size: 13px; line-height: 1.5; }

.obj-tbl { width: 100%; border-collapse: collapse; margin-bottom: 10px; }
.obj-tbl th { padding: 8px 12px; font-size: 9px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: white; text-align: left; }
.obj-tbl td { padding: 10px 12px; font-size: 12px; line-height: 1.5; vertical-align: top; border-top: 1px solid var(--gris-border); }
.obj-tbl tr:nth-child(even) td { background: #FAFAF8; }
.obj-trig { font-style: italic; color: var(--p5); }

.crac-tag { display: inline-block; font-size: 9px; font-weight: 700; letter-spacing: 1px; padding: 1px 5px; border-radius: 2px; margin-right: 3px; margin-bottom: 2px; color: white; }

.warn-box {
  background: #FFFBF0;
  border: 1px solid #F5E0B0;
  border-left: 4px solid var(--orange);
  border-radius: 4px;
  padding: 12px 16px;
  margin-bottom: 10px;
  font-size: 12px;
  line-height: 1.6;
}
.prop-box {
  background: var(--noir);
  border-radius: 4px;
  padding: 16px 20px;
  margin-bottom: 10px;
  border-left: 4px solid var(--orange);
}
.prop-box .prop-lbl {
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: rgba(255,255,255,0.4);
  margin-bottom: 6px;
}
.prop-box p { font-size: 14px; font-style: italic; line-height: 1.7; color: white; }

.q-list { list-style: none; }
.q-list li {
  padding: 9px 14px;
  background: #EEF4FF;
  border-left: 3px solid var(--p1);
  margin-bottom: 5px;
  border-radius: 0 4px 4px 0;
  font-size: 12px;
  font-style: italic;
  line-height: 1.5;
  color: var(--p1);
}
.ctx-list { list-style: none; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.ctx-list li {
  padding: 8px 12px;
  background: #F0FCF4;
  border-left: 3px solid var(--p2);
  border-radius: 0 4px 4px 0;
  font-size: 12px;
  line-height: 1.4;
  color: var(--noir);
}
.sig-list { list-style: none; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.sig-list li {
  padding: 7px 12px;
  background: var(--orange-pale);
  border-left: 3px solid var(--orange);
  border-radius: 0 4px 4px 0;
  font-size: 12px;
  line-height: 1.4;
}
.ns-list { list-style: none; }
.ns-list li {
  padding: 8px 12px;
  background: #F0FCF8;
  border-left: 3px solid var(--p6);
  margin-bottom: 5px;
  border-radius: 0 4px 4px 0;
  font-size: 12px;
  line-height: 1.5;
}
.resist-box {
  background: #FFF0EE;
  border: 1px solid #F5C0B8;
  border-left: 4px solid var(--p5);
  border-radius: 4px;
  padding: 12px 16px;
  margin-bottom: 10px;
}
.resist-lbl { font-size: 9px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--p5); margin-bottom: 6px; }
.resist-box p { font-size: 12px; line-height: 1.6; font-style: italic; }

@media (max-width: 920px) {
  .funnel-side { display: none; }
  .branch-grid { grid-template-columns: 1fr; }
  .oui-grid { grid-template-columns: 1fr; }
  .ctx-list, .sig-list { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<!-- ══ HEADER ════════════════════════════════════════════ -->
<header class="hdr">
  <div style="display:flex;align-items:center;gap:0">
    <div class="logo-wrap">
      <span class="logo-text">vivagence</span>
      <div class="logo-dot"></div>
    </div>
    <span class="logo-tagline">Créateur — Fabricant — Imprimeur</span>
  </div>
  <div class="hdr-right">
    <span class="hdr-doc">Funnel de vente · Scénarios sectoriels</span>
    <span class="hdr-badge">Confidentiel</span>
  </div>
</header>

<!-- ══ SECTOR BAR ═════════════════════════════════════════ -->
<div class="sector-bar">
  <span class="slbl">Secteur</span>
  <button class="sec-btn active" onclick="setSector(0)">CHR</button>
  <button class="sec-btn" onclick="setSector(1)">Grande Distrib.</button>
  <button class="sec-btn" onclick="setSector(2)">Events</button>
  <button class="sec-btn" onclick="setSector(3)">Franchises</button>
  <button class="sec-btn" onclick="setSector(4)">Luxe & Retail</button>
  <button class="sec-btn" onclick="setSector(5)">Food & Bev.</button>
  <button class="sec-btn" onclick="setSector(6)">Banques</button>
  <button class="sec-btn" onclick="setSector(7)">Industrie</button>
  <button class="sec-btn" onclick="setSector(8)">Grands Comptes</button>
  <button class="sec-btn" onclick="setSector(9)">PME/TPE</button>
</div>

<div class="main">

  <!-- ══ PHASE NAV ══════════════════════════════════════ -->
  <nav class="phase-nav" id="pnav"></nav>

  <!-- ══ FUNNEL SIDEBAR ═════════════════════════════════ -->
  <aside class="funnel-side">
    <div class="side-title">Funnel global</div>
    <div id="fside"></div>
    <div class="conv-block">
      <div class="side-title">Taux cibles</div>
      <div class="conv-row"><div class="conv-d" style="background:#1A3B6B"></div><div class="conv-lbl">Lead → Qualifié</div><div class="conv-v" style="color:#1A3B6B">60%</div></div>
      <div class="conv-row"><div class="conv-d" style="background:#1A5C34"></div><div class="conv-lbl">Qualifié → RDV</div><div class="conv-v" style="color:#1A5C34">80%</div></div>
      <div class="conv-row"><div class="conv-d" style="background:#4A2080"></div><div class="conv-lbl">RDV → Devis</div><div class="conv-v" style="color:#4A2080">65%</div></div>
      <div class="conv-row"><div class="conv-d" style="background:#E8621A"></div><div class="conv-lbl">Devis → Closing</div><div class="conv-v" style="color:#E8621A">35%</div></div>
      <div class="conv-row"><div class="conv-d" style="background:#0A5C50"></div><div class="conv-lbl">Client → Renouvt</div><div class="conv-v" style="color:#0A5C50">70%</div></div>
    </div>
  </aside>

  <!-- ══ CONTENT ════════════════════════════════════════ -->
  <main class="content" id="content"></main>

</div>

<script>
// ═══════════════════════════════════════════════════════
// DESIGN TOKENS
// ═══════════════════════════════════════════════════════
const ORANGE = '#E8621A';
const NOIR   = '#1A1A1A';

const PHASES = [

const AUDIO_SCRIPTS = [
  // 0 CHR
  [
    `[Phase Présentation — CHR] Bonjour Monsieur Dupont, je m'appelle Alexandre, je suis responsable de secteur chez Vivagence. Vivagence, c'est une agence de communication globale — on est à la fois agence, fabricant et imprimeur, tout en interne. De la création jusqu'à l'installation chez vous, un seul interlocuteur, des délais jusqu'à J+1. En quelques mots — comment fonctionne aujourd'hui votre communication visuelle ?`,
    `[Phase Objet du jour — CHR] Je vous propose qu'on travaille en 3 temps sur 25 minutes : je vous pose quelques questions sur votre organisation, vous me décrivez ce qui coince, et on voit ensemble si Vivagence peut vous apporter une vraie valeur. Dans le CHR, l'image est votre premier service : un client juge votre établissement avant même de franchir la porte. Ça vous convient ?`,
    `[Phase Découverte — CHR] Comment gérez-vous aujourd'hui la création et l'impression de vos supports visuels ? Quel est votre dernier projet qui s'est mal passé — délai, qualité, cohérence ? Et quand vous avez une urgence — une carte saisonnière, un événement — comment ça se passe concrètement ?`,
    `[Phase Reformulation — CHR] Si je résume ce que vous m'avez dit : vous gérez actuellement plusieurs fournisseurs, vous avez eu des soucis de délai sur votre dernière opération, et votre besoin principal c'est d'avoir quelqu'un qui gère tout sans que vous ayez à superviser chaque étape — avec des délais qui correspondent à vos rythmes d'exploitation. C'est bien ça ?`,
    `[Phase Argumentation — CHR] Vivagence, c'est une production 100% interne : création, impression, pose sous un même toit. Un seul interlocuteur, une seule facture, zéro coordination de votre côté. Nos clients CHR témoignent d'un gain de 4 à 6 heures par mois sur la gestion de leurs prestataires. Et sur les délais : 99% de nos livraisons express honorées dans le délai convenu — garanti contractuellement.`,
    `[Phase Objections — CHR] Vous me dites que vous avez déjà un imprimeur. La vraie question : est-ce qu'il vous livre en J+1, est-ce qu'il pose lui-même, et est-ce qu'il crée aussi vos visuels ? Si non, vous continuez à coordonner 3 métiers différents. Je vous propose un test sur un seul projet pour comparer objectivement — sans aucun engagement.`,
    `[Phase Conclusion — CHR] Je vous propose de commencer par votre prochaine carte saisonnière — budget limité, projet concret, vous testez notre process sans aucun engagement. Je vous envoie un devis sous 48 heures. On convient d'une date de retour en fin de semaine ? Vivagence vous offre la cohérence visuelle d'une grande chaîne, la réactivité d'un artisan local, et la simplicité d'un seul interlocuteur.`,
  ],
  // 1 GRANDE DISTRIBUTION
  [
    `[Présentation — Grande Distribution] Bonjour, je m'appelle Sophie chez Vivagence. On est l'agence qui produit et déploie simultanément sur des centaines de sites — agence, fabricant et imprimeur en un seul interlocuteur. Notre plateforme de pilotage gratuite vous donne une visibilité en temps réel sur chaque magasin. Dans quel périmètre intervenez-vous sur les sujets de communication visuelle ?`,
    `[Objet du jour — Grande Distribution] Je vous propose 40 minutes en 3 temps : je comprends vos déploiements PLV actuels, vous me dites ce qui coince, et je vous montre comment Vivagence peut résoudre ça. Quand vous déployez une opération nationale sur 80 magasins en 5 jours, le moindre retard coûte des ventes. C'est ce que je veux adresser avec vous aujourd'hui.`,
    `[Découverte — Grande Distribution] Sur votre dernière opération nationale, combien de points de vente n'étaient pas prêts à la date J ? Comment savez-vous, en temps réel, que chaque magasin a bien reçu et posé ses supports ? Avez-vous eu des remontées de directeurs de magasin sur des incohérences ou des retards de livraison ?`,
    `[Reformulation — Grande Distribution] Donc si je résume : vous gérez plusieurs opérations par an avec de nombreux fournisseurs à coordonner, vous avez eu des retards sur la dernière campagne, et votre besoin prioritaire c'est d'avoir un partenaire qui garantit le déploiement simultané et vous donne une visibilité en temps réel — sans que vous ayez à relancer chaque intervenant. C'est bien ça ?`,
    `[Argumentation — Grande Distribution] Notre plateforme de pilotage est gratuite — suivi site par site en temps réel. Vous savez à tout moment combien de magasins ont reçu leurs supports. Nos clients GMS réduisent de 60% le temps passé à relancer les équipes terrain. Et un seul contrat, une facture mensuelle consolidée — votre service achats ne gère plus 8 fournisseurs.`,
    `[Objections — Grande Distribution] Vous avez des partenariats avec vos imprimeurs depuis des années. Je le comprends. Ce que Vivagence apporte en plus : la coordination multi-sites, la pose, et le pilotage temps réel. Testez-nous sur une opération secondaire sans toucher à vos partenariats habituels. Et si votre outil de suivi interne est déjà en place — notre plateforme s'intègre en API. On s'adapte à votre écosystème.`,
    `[Conclusion — Grande Distribution] Vous m'avez dit que votre prochaine opération nationale est dans quelques semaines. Pour être opérationnel à temps, le paramétrage doit être lancé maintenant. Est-ce qu'on planifie une réunion technique la semaine prochaine pour cadrer ça ? Vivagence est le seul partenaire qui vous donne production nationale, pose coordonnée et visibilité temps réel en une seule relation contractuelle.`,
  ],
  // 2 EVENTS
  [
    `[Présentation — Agences Events] Bonjour, je m'appelle Thomas chez Vivagence. On est fabricant de supports de communication — tout en interne. Ce qui est pertinent pour les agences events : on produit 7 jours sur 7 et on a un programme partenaire qui vous permet de marginer sur nos productions. Comment fonctionnez-vous pour la production de vos supports physiques ?`,
    `[Objet du jour — Events] 25 minutes en 3 temps : vos douleurs de production, ce qu'on fait, et si ça fait sens ensemble. Dans l'événementiel, une date est absolue — il n'y a pas de presque à l'heure. Ma question directe : qu'est-ce que vous faites quand un fournisseur vous plante à J moins 2 ?`,
    `[Découverte — Events] Sur vos 3 derniers événements, combien de fois un fournisseur vous a fait défaut en dernière minute ? Est-ce que vous marger sur la production de vos supports physiques — ou vous les passez en transparence ? Comment gérez-vous un brief qui arrive le vendredi soir pour un événement lundi matin ?`,
    `[Reformulation — Events] Ce que vous me dites : vous avez besoin d'un fabricant qui tient les délais impossibles, qui installe lui-même, et qui vous permet de dégager une marge sur la production physique. Et quelqu'un qui sait ce qu'est un J moins 1 sans paniquer. C'est bien ça ?`,
    `[Argumentation — Events] Vivagence produit 7 jours sur 7. Votre brief du vendredi soir est en production samedi matin, livraison dimanche soir, vous êtes prêt lundi. Et notre programme partenaire revendeur : vous facturez la production à votre client avec votre marge — Vivagence vous facture à prix partenaire. Nos agences partenaires dégagent 12 à 18% de marge nette.`,
    `[Objections — Events] Vous avez votre réseau de fournisseurs rodé. C'est votre force — Vivagence vient en complément. Sur les urgences où votre réseau habituel ne peut pas répondre, on est là. Et sur le programme partenaire : aucune exclusivité, aucun volume minimum. Vous commandez quand vous voulez. Si vous doutez des délais : donnez-moi un brief fictif, je vous donne le délai exact et le prix en 2 heures.`,
    `[Conclusion — Events] Je vous propose de signer le programme partenaire aujourd'hui — 5 minutes, sans engagement de volume — et de tester sur votre prochain événement. Vous avez accès aux tarifs partenaires dès demain matin. Vivagence est votre back-office production : invisible pour votre client, irremplaçable pour vous.`,
  ],
  // 3 FRANCHISES
  [
    `[Présentation — Réseaux & Franchises] Bonjour, chez Vivagence on centralise les commandes de tous vos franchisés sur une plateforme gratuite avec vos standards visuels intégrés, et on déploie sur toute la France et l'Espagne. Comment est organisée aujourd'hui la gestion de la communication visuelle au sein de votre réseau ?`,
    `[Objet du jour — Franchises] 40 minutes structurées : je comprends comment votre réseau gère l'image aujourd'hui, vous me dites ce qui ne fonctionne pas assez bien, et je vous montre comment Vivagence peut y répondre concrètement. La force d'un réseau, c'est la cohérence. Un franchisé qui dévie visuellement, c'est votre marque qui en souffre.`,
    `[Découverte — Franchises] Comment vous assurez-vous que chaque franchisé respecte la charte lors d'une ouverture ? Qu'est-ce qui se passe concrètement quand un franchisé commande en dehors du circuit agréé ? Sur votre dernier relook réseau, quel a été le délai entre le premier et le dernier site traité ?`,
    `[Reformulation — Franchises] Votre principal défi c'est de garantir la cohérence de votre image sur l'ensemble de vos sites avec des franchisés qui ont des comportements différents, sans outil centralisé pour contrôler ça. Et votre priorité, c'est de reprendre le contrôle avant votre prochain relook ou lancement. C'est bien ça ?`,
    `[Argumentation — Franchises] Notre catalogue réseau centralisé intègre vos standards visuels : chaque franchisé accède à une boutique avec uniquement vos produits agréés — il commande en autonomie, vous êtes sûr qu'il est conforme. Et les tarifs négociés mutualisés : le franchisé de province paie le même prix que celui de Paris. Économie moyenne de 22% sur le coût annuel.`,
    `[Objections — Franchises] Vos franchisés vont résister au changement de fournisseur — c'est normal. Ce qu'on leur apporte : tarifs mutualisés moins chers qu'en local, plateforme simple, livraison rapide. En pratique, les franchisés adhèrent dès qu'ils voient la simplicité et les prix. Et la mise en place de la plateforme : 5 jours ouvrés, c'est notre équipe qui fait le setup.`,
    `[Conclusion — Franchises] Vous avez une convention réseau à venir. C'est l'occasion parfaite pour lancer la plateforme et présenter Vivagence à vos franchisés. On peut être opérationnel 3 semaines avant. Est-ce qu'on planifie le kick-off la semaine prochaine ? Vivagence donne à chaque franchisé l'autonomie de commander, et à vous la certitude qu'il est conforme.`,
  ],
  // 4 LUXE
  [
    `[Présentation — Luxe & Retail] Bonjour, chez Vivagence on est une maison de fabrication — agence, imprimeur et poseur en un seul interlocuteur. Nous travaillons avec des maisons qui ont des exigences de finition très élevées : Pantone imposés, matériaux spécifiques, installations hors horaires d'ouverture. Qui chez vous est en charge de la validation des supports visuels physiques ?`,
    `[Objet du jour — Luxe] 45 minutes : vous me décrivez vos exigences et vos douleurs actuelles, je vous montre comment on travaille concrètement, et on évalue ensemble si notre niveau de service correspond à vos standards. Si ce n'est pas le cas, je préfère qu'on le sache maintenant. Dans le luxe, votre vitrine est le premier produit que vous vendez.`,
    `[Découverte — Luxe] Quel a été votre dernier support visuel qui ne correspondait pas exactement aux spécifications de la maison ? Comment gérez-vous la validation des BAT sur des impressions avec des Pantone spécifiques ? Avez-vous eu des équipes de pose qui ne maîtrisaient pas les codes du secteur — bruit, manque de soin, retards ?`,
    `[Reformulation — Luxe] Vous avez des exigences de finition et de charte que peu de prestataires tiennent vraiment, vos délais d'ouverture sont non négociables, et vous avez besoin d'équipes qui savent se comporter dans vos espaces. Ce que vous cherchez, c'est un partenaire de confiance — pas un fournisseur de plus. C'est ça ?`,
    `[Argumentation — Luxe] Votre responsable VM valide un BAT physique avant production — ce que vous validez est exactement ce qui est posé en boutique. Nos équipes d'installation sont formées aux environnements haut de gamme : tenue professionnelle, silence, protection des surfaces, remise en état parfaite. Et un interlocuteur dédié qui connaît votre maison dès la première commande.`,
    `[Objections — Luxe] Vos prestataires actuels connaissent la maison depuis des années — c'est une vraie valeur. Je ne cherche pas à la remplacer. Je vous propose de nous montrer sur un projet ponctuel, le plus exigeant possible. Si on n'est pas à la hauteur, vous confirmez votre choix actuel. Si on l'est, vous avez un second partenaire de confiance. Sur la confidentialité : NDA signé dès le début, aucune communication externe sans validation écrite.`,
    `[Conclusion — Luxe] Je vous propose de préparer un échantillon de votre support le plus critique avec vos spécifications exactes — Pantone, matière, finition. Vous le tenez dans les mains avant toute décision. Je reviens vers vous dans 5 jours avec l'échantillon. Vivagence est la maison de fabrication que votre maison mérite — même niveau d'exigence, même discrétion, même sens du détail.`,
  ],
  // 5 F&B
  [
    `[Présentation — Food & Beverage] Bonjour, chez Vivagence on produit la PLV trade en cohérence colorimétrique avec le packaging, et on peut déployer sur votre réseau GMS en J+2 sur les supports standards. Vous intervenez plutôt sur la partie lancement produit, les opérations trade marketing, ou les deux ?`,
    `[Objet du jour — F&B] 30 minutes : on parle de vos enjeux trade actuels, vous me dites ce qui coince, et je vous montre comment Vivagence peut raccourcir vos délais. Dans le F&B, un lancement c'est un chrono. Ce que j'observe souvent : un décalage entre le produit en rayon et la PLV — et ça coûte des ventes au lancement.`,
    `[Découverte — F&B] Sur votre dernier lancement, quel a été le délai entre la validation du packaging et la PLV en rayon ? Avez-vous eu des écarts de couleur entre votre packaging et vos supports PLV ? Combien de références PLV gérez-vous par an, et combien de fournisseurs pour les produire ?`,
    `[Reformulation — F&B] Vous gérez plusieurs lancements par an avec différents fournisseurs, vous avez eu des problèmes de cohérence couleur ou de délai, et votre besoin c'est un prestataire qui prend en charge la PLV en cohérence avec votre packaging, dans des délais compatibles avec vos lancements. C'est bien ça ?`,
    `[Argumentation — F&B] Production interne PAO et impression : la couleur de votre ILV est calibrée sur le même profil ICC que votre emballage. Delta E inférieur à 1 — standard luxe appliqué au mass market. Et notre gamme trade complète : ILV, stop-rayon, tête de gondole, habillage réfrigéré — tout en une commande, livré en même temps sur tous vos sites GMS.`,
    `[Objections — F&B] Votre agence de design gère déjà la PLV — très bien. On travaille sur vos fichiers. Votre agence crée, Vivagence produit et livre. Vous gardez votre relation créa, vous gagnez en rapidité et cohérence de production. Sur les volumes importants : donnez-moi vos volumes annuels par famille de produit, je vous reviens avec une capacité confirmée et un tarif volume dans les 24 heures.`,
    `[Conclusion — F&B] Vous m'avez parlé de votre prochain lancement. Pour que vos supports soient en rayon à temps, la commande doit partir rapidement. Je vous fais un devis aujourd'hui. On peut le valider en fin de semaine ? Vivagence garantit que votre produit et son univers visuel arrivent en rayon le même jour, avec la même couleur, sans que vous ayez à gérer une seule relance.`,
  ],
  // 6 BANQUES
  [
    `[Présentation — Banques & Assurances] Bonjour, chez Vivagence on déploie sur des centaines d'agences de manière coordonnée, avec un reporting de suivi que vous pouvez présenter à votre direction, et des installations réalisées exclusivement hors horaires d'ouverture. Est-ce que vous intervenez plutôt sur la partie immobilière et rénovations, ou sur la communication visuelle au sens large ?`,
    `[Objet du jour — Banques] 40 minutes structurées : je comprends votre organisation et vos douleurs actuelles, je vous présente comment Vivagence travaille avec des réseaux similaires au vôtre, et on voit si ça vaut la peine d'aller plus loin. Dans les secteurs financiers, l'image est un vecteur de confiance direct. Une agence non relookée depuis 8 ans, c'est un signal négatif pour le client.`,
    `[Découverte — Banques] Si vous deviez noter l'état visuel actuel de votre réseau de 1 à 10 en cohérence de charte — vous diriez quoi ? Sur votre dernier relook, quel a été le délai entre la première et la dernière agence ? Avez-vous eu des incidents lors d'installations — bruit, désordre, retard d'ouverture ?`,
    `[Reformulation — Banques] Votre réseau compte de nombreuses agences avec un état visuel hétérogène, votre dernier déploiement a pris plusieurs mois à cause de problèmes de coordination, et votre priorité c'est d'avoir un prestataire qui prend en charge l'ensemble — production, pose, reporting — sans que vous ayez à être dans l'opérationnel. C'est bien ça ?`,
    `[Argumentation — Banques] Un interlocuteur unique coordonnant toutes les directions impliquées : votre chef de projet Vivagence est l'interface entre direction immobilière, marketing et terrain. Et un planning de déploiement validé agence par agence avec reporting hebdomadaire — vous pouvez rendre compte à votre DG en 2 minutes. 100% de nos interventions en agences bancaires réalisées hors heures d'ouverture.`,
    `[Objections — Banques] Vous avez des contraintes de conformité très strictes — nos équipes connaissent les obligations du secteur financier. On travaille avec votre service conformité, pas contre lui. Et le processus de validation interne long : la production ne démarre qu'après le BAT validé. On intègre vos délais dans notre planning dès le début. On ne vous met jamais sous pression.`,
    `[Conclusion — Banques] Je vous propose un audit visuel de votre réseau — gratuit, 2 semaines sur 10 agences pilotes, et vous avez un rapport complet avec tout ce qui doit être mis à jour et le budget correspondant. Vous décidez en connaissance de cause. On planifie l'audit ? Vivagence est le partenaire institutionnel qui déploie votre image avec la rigueur que votre secteur exige.`,
  ],
  // 7 INDUSTRIE
  [
    `[Présentation — Industrie] Bonjour, chez Vivagence on a une expertise en signalétique industrielle : supports normés ISO pour la sécurité, matériaux résistants aux environnements difficiles, et un audit gratuit de conformité de votre signalétique existante. Vous avez une responsabilité directe sur la signalétique de sécurité du site ?`,
    `[Objet du jour — Industrie] 30 minutes : je comprends l'état actuel de votre signalétique et vos contraintes réglementaires, je vous dis honnêtement ce qu'on peut faire, et on voit si un audit gratuit sur votre site a du sens. Dans l'industrie, la signalétique n'est pas une question d'image — c'est une question de conformité réglementaire et de responsabilité personnelle.`,
    `[Découverte — Industrie] Quand avez-vous fait le dernier audit de conformité de votre signalétique de sécurité ? Quels types de supports vous causent le plus de problèmes de durabilité ? En cas de contrôle DREAL ou inspection du travail demain — vous êtes serein sur l'état de votre signalétique aujourd'hui ?`,
    `[Reformulation — Industrie] Votre signalétique de sécurité n'a pas été révisée depuis plusieurs années, vous avez des supports qui se dégradent dans votre environnement, et vous avez un audit ou contrôle à venir qui vous expose si vous n'êtes pas en conformité. Et en parallèle, vous voudriez améliorer l'image globale du site. C'est bien ça ?`,
    `[Argumentation — Industrie] Signalétique certifiée conforme aux normes ISO 7010, NF EN 1838 et NF X08 : chaque panneau livré est documenté avec sa référence normative. Zéro non-conformité relevée sur les sites clients Vivagence lors des inspections DREAL en 2024. Et des matériaux industriels spéciaux : inox, aluminium anodisé, PVC rigide — durabilité garantie 5 à 10 ans selon l'environnement.`,
    `[Objections — Industrie] Votre service maintenance gère ça — vos équipes ont d'autres priorités. On prend ce poste pour eux : production, mise à jour réglementaire, installation. Et si la signalétique n'est pas un budget prioritaire : en cas de contrôle avec un panneau non conforme, c'est votre responsabilité personnelle. Le coût d'une mise en conformité est très inférieur au coût d'une mise en demeure.`,
    `[Conclusion — Industrie] Je vous propose qu'on commence par l'audit — c'est gratuit, une demi-journée sur votre site, et vous avez un rapport complet avec tout ce qui doit être mis à jour et le budget. Vous décidez ensuite. Quelle est la meilleure semaine pour vous ? Vivagence est votre partenaire de conformité : on garantit que votre signalétique est en règle aujourd'hui et qu'elle le reste dans le temps.`,
  ],
  // 8 GRANDS COMPTES
  [
    `[Présentation — Grands Comptes] Bonjour, je suis directeur de compte chez Vivagence. On est une agence de communication globale, fabricant et imprimeur, tout en interne. Ce qui intéresse les groupes de votre taille : notre capacité à consolider la communication visuelle sur l'ensemble de vos entités — France, Espagne, zone euro — en un seul contrat, une seule facture. On remplace 8 à 15 prestataires par 1. Comment est organisée aujourd'hui la décision sur les achats de communication visuelle dans votre groupe ?`,
    `[Objet du jour — Grands Comptes] Une heure structurée en 3 parties : je comprends comment votre groupe gère ses achats communication visuelle, vous me dites ce qui ne fonctionne pas, et je vous présente comment Vivagence peut simplifier et économiser. Ce que j'observe dans les groupes de votre taille : la dépense annuelle en communication visuelle est souvent entre 800 000 et 3 millions d'euros — mais personne ne connaît le chiffre exact.`,
    `[Découverte — Grands Comptes] Si je vous demande combien votre groupe dépense en communication visuelle sur l'année — vous pouvez me donner un chiffre ? Combien de prestataires différents gèrent cette dépense au niveau groupe ? Avez-vous mené un appel d'offres sur ce poste de dépense dans les 3 dernières années ?`,
    `[Reformulation — Grands Comptes] Votre groupe dépense plusieurs millions par an en communication visuelle, répartis entre de nombreux prestataires, sans vision consolidée ni politique achats uniforme. Résultat : coûts variables, cohérence de marque aléatoire, et du temps de vos équipes consommé à gérer des prestataires. Ce que vous cherchez : simplifier, contrôler et économiser. C'est bien ça ?`,
    `[Argumentation — Grands Comptes] Consolidation fournisseur : un contrat cadre remplace 8 à 15 prestataires. Un grand compte retail a consolidé 11 prestataires en 1, économie de 28% dès l'an 1, temps achats réduit de 60%. Un account manager dédié qui connaît votre groupe — joignable directement. Et un déploiement international : France, Espagne, zone euro, même standard, mêmes tarifs.`,
    `[Objections — Grands Comptes] Vous avez un appel d'offres groupes — absolument, on est organisés pour ça. Envoyez-moi le cahier des charges dès qu'il est disponible. Et vos entités locales ont leurs habitudes fournisseurs : on propose une migration progressive. Les nouvelles commandes passent par Vivagence, les prestataires existants sont maintenus sur les projets en cours. En 12 à 18 mois, la consolidation se fait naturellement.`,
    `[Conclusion — Grands Comptes] Je vous propose une simulation ROI basée sur vos données réelles — donnez-moi 3 factures de vos prestataires actuels, je vous montre ce qu'on économise — et une rencontre avec notre directeur des opérations pour les questions techniques. À l'issue, vous avez tous les éléments pour décider. Vivagence vous offre la simplification que vous n'avez jamais osé engager sur ce poste — 20 à 30% d'économies dès l'an 1.`,
  ],
  // 9 PME/TPE
  [
    `[Présentation — PME/TPE] Bonjour, je m'appelle Marc chez Vivagence. Vivagence, c'est une agence de communication qui fait tout en interne : on crée, on imprime et on installe. Ce qui change pour vous par rapport à un imprimeur classique : on vous conseille sur ce qui va vraiment fonctionner, on vous donne le prix avant de commencer, et on livre vite. Et vous, qu'est-ce que vous faites comme activité ?`,

// Étape 1 — enrichir le script brut en monologue naturel
async function polishScript(rawScript) {
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      model: 'claude-sonnet-4-20250514',
      max_tokens: 450,
      system: `Tu es un commercial B2B français senior, expert en vente téléphonique. 
Tu réécris des scripts de vente pour qu'ils sonnent exactement comme un vrai appel professionnel.

RÈGLES ABSOLUES :
1. Supprime TOUTES les didascalies [entre crochets] et les intitulés de phase
2. Commence directement par la prise de parole, sans préambule
3. Phrases courtes, rythmées, naturelles — comme on parle vraiment
4. Ton professionnel mais humain, chaleureux et confiant, jamais robotique
5. Utilise des connecteurs naturels : "En fait,", "Concrètement,", "Ce qui est intéressant,", "Du coup,"
6. Ajoute une respiration naturelle après les questions (ponctuation claire)
7. Exactement 120 à 150 mots — ni plus, ni moins
8. Dernière phrase : question ouverte ou invitation directe à l'action
9. Pas de guillemets autour du texte, pas de tirets en liste — du texte continu
10. Vouvoiement systématique et professionnel`,
      messages: [{
        role: 'user',
        content: `Réécris ce script en monologue téléphonique naturel de 120-150 mots :\n\n${rawScript}`
      }]
    })
  });
  if (!res.ok) throw new Error(`API error ${res.status}`);
  const data = await res.json();
  const text = data.content?.[0]?.text || rawScript;
  // Nettoyer les éventuels résidus
  return text
    .replace(/\[.*?\]/g, '')
    .replace(/^\s*["«]/,'')
    .replace(/["»]\s*$/,'')
    .trim();
}

// Étape 2 — synthèse vocale via Anthropic TTS (modèle natif)
async function synthesizeSpeech(text) {
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      model: 'claude-sonnet-4-20250514',
      max_tokens: 1024,
      messages: [{
        role: 'user',
        content: text
      }],
      tools: [{
        type: 'computer_20241022',
        name: 'computer',
        display_width_px: 1,
        display_height_px: 1
      }],
      // TTS via content type audio
      system: 'Réponds uniquement en audio. Tu es un commercial français au téléphone.'
    })
  });
  // Fallback si TTS non dispo : retourner null pour passer au Web Speech
  if (!res.ok) return null;
  const data = await res.json();
  const audioBlock = data.content?.find(b => b.type === 'audio' || b.type === 'tool_result');
  if (audioBlock?.data) {
    const binary = atob(audioBlock.data);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    return URL.createObjectURL(new Blob([bytes], { type: 'audio/mpeg' }));
  }
  return null;
}

// Fallback — Web Speech API optimisé voix française
function speakWithBrowser(text, key, onEnd) {
  if (!('speechSynthesis' in window)) return false;
  window.speechSynthesis.cancel();

  // Nettoyer et normaliser le texte
  const clean = text
    .replace(/\*\*/g, '')
    .replace(/\*/g, '')
    .replace(/#{1,3} /g, '')
    .replace(/\n\n/g, '. ')
    .replace(/\n/g, ', ')
    .trim();

  // Découper en phrases pour éviter la coupure Chrome (limite ~200 chars)
  const sentences = clean.match(/[^.!?…]+[.!?…]+\s*/g) || [clean];

  // Grouper en chunks de max 180 chars
  const chunks = [];
  let current = '';
  for (const s of sentences) {
    if ((current + s).length > 180 && current.length > 0) {
      chunks.push(current.trim());
      current = s;
    } else {
      current += s;
    }
  }
  if (current.trim()) chunks.push(current.trim());
  if (!chunks.length) chunks.push(clean);

  let chunkIdx = 0;
  let stopped = false;

  const speakNext = () => {
    if (stopped || chunkIdx >= chunks.length) {
      if (!stopped) onEnd();
      return;
    }

    const utt = new SpeechSynthesisUtterance(chunks[chunkIdx]);
    utt.lang = 'fr-FR';
    utt.rate = 0.87;    // plus lent = plus naturel et professionnel
    utt.pitch = 1.06;   // légèrement chaleureux
    utt.volume = 1.0;

    // Sélection de voix française — ordre de préférence
    const voices = window.speechSynthesis.getVoices();
    const preferredNames = [
      'Thomas',           // macOS — voix masculine française naturelle
      'Amelie',           // macOS canadien-français
      'Aurelie',          // macOS
      'Virginie',         // macOS
      'Google français',  // Chrome
      'Microsoft Paul Online (Natural)',   // Edge
      'Microsoft Hortense Online (Natural)',
      'Microsoft Paul',
      'Microsoft Hortense',
    ];

    let voice = null;
    for (const name of preferredNames) {
      voice = voices.find(v => v.name.includes(name));
      if (voice) break;
    }
    // Fallback : n'importe quelle voix fr-FR
    if (!voice) voice = voices.find(v => v.lang === 'fr-FR');
    // Dernier recours : fr-CA ou fr-BE
    if (!voice) voice = voices.find(v => v.lang.startsWith('fr'));
    if (voice) utt.voice = voice;

    utt.onend = () => {
      chunkIdx++;
      // Petite pause entre les phrases pour le naturel
      if (chunkIdx < chunks.length) {
        setTimeout(speakNext, 80);
      } else {
        onEnd();
      }
    };
    utt.onerror = (e) => {
      if (e.error !== 'interrupted') { chunkIdx++; setTimeout(speakNext, 50); }
    };

    window.speechSynthesis.speak(utt);
  };

  // Workaround bug Chrome : keepalive avec setInterval
  const keepAlive = setInterval(() => {
    if (window.speechSynthesis.speaking) {
      window.speechSynthesis.pause();
      window.speechSynthesis.resume();
    } else {
      clearInterval(keepAlive);
    }
  }, 10000);

  speakNext();

  // Stocker le cleanup
  window._speechCleanup = () => {
    stopped = true;
    clearInterval(keepAlive);
    window.speechSynthesis.cancel();
  };

  return true;
}

// Orchestrateur principal
async function generateAudio(sIdx, pIdx) {
  const key = `${sIdx}-${pIdx}`;
  const btn      = document.getElementById(`abtn-${key}`);
  const statusEl = document.getElementById(`ast-${key}`);
  const playerWrap = document.getElementById(`aplayer-${key}`);
  const waveEl   = document.getElementById(`awave-${key}`);

  // Si déjà en cache → relire directement
  if (audioCache[key]) {
    playBlobAudio(audioCache[key], key, statusEl, waveEl, btn, playerWrap);
    return;
  }

  // Arrêter tout audio en cours
  stopAllAudio();

  btn.disabled = true;
  btn.textContent = '⏳ Écriture…';
  statusEl.textContent = "L'IA rédige le script commercial…";

  const rawScript = AUDIO_SCRIPTS[sIdx]?.[pIdx] || 'Script non disponible.';

  let polished = rawScript;
  let audioUrl = null;

  try {
    // Phase 1 — enrichissement du script
    statusEl.textContent = "Optimisation du script par l'IA…";
    polished = await polishScript(rawScript);
  } catch(e) {
    console.warn('Script polish failed, using raw:', e);
    polished = rawScript.replace(/\[.*?\]/g, '').trim();
  }

  // Afficher le script pendant la lecture
  showScript(polished, playerWrap);

  // Phase 2 — TTS : essayer d'abord le Web Speech API optimisé
  btn.textContent = '⏳ Synthèse…';
  statusEl.textContent = "Synthèse vocale en cours…";

  if (waveEl) waveEl.classList.add('playing');
  btn.disabled = false;
  btn.textContent = '⏹ Arrêter';
  btn.onclick = () => stopAllAudio(key);

  const ok = speakWithBrowser(polished, key, () => {
    stopAudioUI(key);
  });

  if (!ok) {
    statusEl.textContent = "Synthèse vocale non disponible — script affiché ci-dessous.";
    stopAudioUI(key);
  } else {
    statusEl.textContent = "Lecture en cours — appel commercial IA…";
  }
}

function playBlobAudio(url, key, statusEl, waveEl, btn, playerWrap) {
  stopAllAudio();
  if (waveEl) waveEl.classList.add('playing');
  statusEl.textContent = 'Lecture en cours…';
  btn.disabled = false;
  btn.textContent = '⏹ Arrêter';
  btn.onclick = () => stopAllAudio(key);
  const audio = new Audio(url);
  audio.onended = () => stopAudioUI(key);
  audio.onerror = () => stopAudioUI(key);
  audio.play();
  currentAudio = audio;
}

function showScript(text, playerWrap) {
  if (!playerWrap) return;
  playerWrap.innerHTML = `
    <div style="background:#222;border-radius:4px;padding:12px 14px;margin-top:10px;border-left:3px solid #E8621A">
      <div style="font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:rgba(255,255,255,0.3);margin-bottom:7px">
        Script enrichi par l'IA · Commercial Vivagence
      </div>
      <p style="font-size:12px;line-height:1.8;color:rgba(255,255,255,0.82);font-style:italic">${text}</p>
    </div>`;
}

function stopAllAudio(key) {
  if (window._speechCleanup) { window._speechCleanup(); window._speechCleanup = null; }
  if ('speechSynthesis' in window) window.speechSynthesis.cancel();
  if (currentAudio) { currentAudio.pause(); currentAudio = null; }
  if (key) stopAudioUI(key);
}

function stopAudioUI(key) {
  const waveEl = document.getElementById(`awave-${key}`);
  const btn    = document.getElementById(`abtn-${key}`);
  const statusEl = document.getElementById(`ast-${key}`);
  if (waveEl) waveEl.classList.remove('playing');
  if (statusEl) statusEl.textContent = 'Démo vocale IA — cliquez pour rejouer.';
  if (btn) {
    btn.disabled = false;
    btn.textContent = '▶ Rejouer';
    btn.onclick = () => generateAudio(curSector, curPhase);
  }
}

function branchBg(t) { return t==='yes'?'#E8F9EF':t==='no'?'#FDF0EE':'#FDF5E6'; }
function branchBorder(t) { return t==='yes'?'#1A5C34':t==='no'?'#C0180C':'#E8621A'; }
function branchLbl(t) { return t==='yes'?'✓ OUI':t==='no'?'✗ NON':'? HÉSITATION'; }

function scenHTML(scens) {
  if(!scens||!scens.length) return '';
  return `<div class="blk"><div class="blk-title">Scénarios selon la réponse</div>
    <div class="branch-grid">${scens.map(s=>`
      <div class="branch" style="background:${branchBg(s.t)};border-color:${branchBorder(s.t)}">
        <div class="b-tag" style="color:${branchBorder(s.t)}">${branchLbl(s.t)}</div>
        <div class="b-trigger">"${s.trig}"</div>
        <div class="b-action">${s.act}</div>
        <div class="b-next" style="background:${branchBorder(s.t)}">${s.nx}</div>
      </div>`).join('')}
    </div></div>`;
}

    <div style="display:flex;align-items:center;gap:14px;width:100%">
      <div class="audio-icon" onclick="generateAudio(${sIdx},${pIdx})" title="Lancer la démo vocale">
        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </div>
      <div class="audio-info" style="flex:1;min-width:0">
        <div class="audio-title">
          Démo vocale IA
          <span style="font-weight:400;opacity:0.55;font-size:11px;margin-left:6px">· ${pName} · ${sName}</span>
        </div>
        <div class="audio-status" id="ast-${key}">Script enrichi par l'IA · Voix française synthétisée</div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:7px;flex-shrink:0">
        <div class="audio-wave" id="awave-${key}">
          <span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span><span></span>
        </div>
        <button class="audio-gen-btn" id="abtn-${key}" onclick="generateAudio(${sIdx},${pIdx})">
          ▶ &nbsp;Lancer la démo

}

    {ph:PHASES[0],w:100,pct:null},

    {ph:PHASES[2],w:90,pct:'90% après cadrage'},

    {ph:PHASES[4],w:65,pct:'65% désir créé'},
    {ph:PHASES[5],w:50,pct:'50% objections levées'},
    {ph:PHASES[6],w:35,pct:'35% → closing'},
  ];
  document.getElementById('fside').innerHTML = items.map((it,i)=>`
    <div class="fl" onclick="setPhase(${it.ph.id})">
      <div class="fb" style="background:${it.ph.color};width:${it.w}%">
        <span class="fn">${it.ph.num}</span>
        <span class="ft">${it.ph.label.toUpperCase()}</span>

    ${it.pct?`<div class="fpct">${it.pct}</div>`:''}
    ${i<items.length-1?'<div class="farr">▼</div>':''}

}

// ═══════════════════════════════════════════════════════
// PUBLIC ACTIONS
// ═══════════════════════════════════════════════════════
function setSector(idx) {
  curSector = idx;
  window.speechSynthesis && window.speechSynthesis.cancel();
  document.querySelectorAll('.sec-btn').forEach((b,i)=>b.classList.toggle('active',i===idx));
  renderNav(); renderContent();
  setPhase(curPhase);
}

function setPhase(idx) {
  curPhase = idx;
  document.querySelectorAll('.pnav-item').forEach((el,i)=>el.classList.toggle('active',i===idx));
  document.querySelectorAll('.phase-pane').forEach((el,i)=>el.classList.toggle('on',i===idx));
  document.getElementById('content').scrollTo({top:0,behavior:'smooth'});
}

// Pre-load voices — important pour Safari/Chrome qui chargent en async
let voicesReady = false;
function preloadVoices() {
  if (!('speechSynthesis' in window)) return;
  const v = window.speechSynthesis.getVoices();
  if (v.length > 0) { voicesReady = true; return; }
  window.speechSynthesis.onvoiceschanged = () => {
    voicesReady = true;
    window.speechSynthesis.getVoices(); // force cache
  };
}
preloadVoices();

renderNav();
renderFunnel();
renderContent();
