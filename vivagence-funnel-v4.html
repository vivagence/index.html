{
  name:'Réseaux & Franchises', color:'#2E7D32',
  cible:'Directeur développement réseau, directeur marketing franchise, responsable communication enseigne',
  duree:'45 min',
  p0:{
    presComm:`"Bonjour [Prénom], je m'appelle [Prénom] chez Vivagence. Vivagence, c'est une agence de communication globale — fabricant, créateur et imprimeur en un seul interlocuteur. Ce qui nous distingue pour les réseaux franchisés, c'est notre capacité à centraliser les commandes de tous vos franchisés sur une plateforme gratuite avec vos standards visuels intégrés, et à déployer sur toute la France et la zone euro. Vos franchisés commandent en autonomie, vous gardez le contrôle total sur la conformité."`,
    qInterlo:`"Avant d'aller plus loin, comment est organisée aujourd'hui la gestion de la communication visuelle au sein de votre réseau — est-ce que c'est centralisé depuis la tête de réseau, ou chaque franchisé commande de son côté ?"`,
    lienTerrain:`"Je pose la question parce que c'est souvent là que le bât blesse dans les réseaux : les franchisés qui commandent en local génèrent des incohérences que la tête de réseau ne détecte qu'à l'audit annuel — et ça fragilise la marque sans qu'on s'en rende compte au quotidien."`,
    scen:[
      {t:'yes',trig:'Il décrit son organisation actuelle clairement',act:'Identifier immédiatement les failles : commandes décentralisées, incohérences visuelles, manque de visibilité. Rebondir dessus.',nx:'→ Phase 1 : Objet du jour'},
      {t:'maybe',trig:'Il est vague sur l\'organisation',act:'"Est-ce que chaque franchisé a la liberté de choisir ses propres fournisseurs visuels — enseigne, PLV, supports ?" Question plus directe pour qualifier le risque d\'incohérence.',nx:'→ Qualifier le niveau de décentralisation'},
      {t:'no',trig:'Il dit que tout est centralisé et bien géré',act:'"Excellent. Alors ma question porte sur l\'international : comment gérez-vous la cohérence visuelle sur vos sites espagnols ou européens ?" Trouver l\'angle non résolu.',nx:'→ Angle international ou expansion'}
    ]
  },
  p1:{
    cadrage:`"Est-ce que vous pouvez m'accorder quelques minutes ? Je voudrais comprendre comment votre réseau gère l'image aujourd'hui, vous me dites ce qui ne fonctionne pas assez bien, et je vous montre comment Vivagence peut y répondre concrètement."`,
    accroche:`"La force d'un réseau franchisé, c'est la cohérence de la marque. Un franchisé qui dévie visuellement — même légèrement — c'est votre image qui en souffre, et souvent la tête de réseau ne le voit qu'à l'audit annuel. Mon sujet aujourd'hui, c'est de vous proposer un système où la conformité visuelle est garantie par défaut, sans effort supplémentaire de contrôle de votre part."`,
    regle:`"Je vais vous poser des questions sur le fonctionnement réel de votre réseau — y compris les dysfonctionnements. Plus vous êtes précis, plus ma proposition sera pertinente et adaptée à votre réalité terrain."`,
    oui1:'Accord pour quelques minutes d\'échange',
    oui2:'Accord pour parler des dysfonctionnements réels du réseau',
    oui3:'Accord pour évaluer une proposition concrète en fin d\'entretien',
    resist:`"Je comprends. Juste une question alors : est-ce que tous vos franchisés respectent exactement la charte visuelle aujourd'hui — à 100% ?"`,
    scen:[
      {t:'yes',trig:'Il accepte et est ouvert sur les défis du réseau',act:'Lancer immédiatement : "Sur vos X sites, combien estimez-vous respectent exactement la charte visuelle aujourd\'hui ?" Question chiffrée pour ancrer la réalité.',nx:'→ Phase 2 : Découverte'},
      {t:'maybe',trig:'Il est prudent ou sur la défensive',act:'Recentrer sur la valeur : "Je ne cherche pas à pointer des problèmes — je cherche à comprendre comment vous pouvez gagner du temps et reprendre le contrôle sans effort supplémentaire."',nx:'→ Approche positive : gain de temps et simplification'},
      {t:'no',trig:'Il dit que le réseau fonctionne bien',act:'"C\'est parfait — dans ce cas, mon sujet c\'est de vous montrer comment maintenir ce niveau de conformité en réduisant votre charge de contrôle, et en améliorant les coûts pour vos franchisés."',nx:'→ Angle optimisation et coûts franchisés'}
    ]
  },
  p2:{
    ctx:[
      'Dans les réseaux franchisés, 30 à 40% des franchisés commandent en dehors des circuits agréés — générant des incohérences visuelles non contrôlées (logo mal appliqué, couleurs décalées, supports non conformes)',
      'Les relooks de réseau prennent en moyenne 18 mois quand ils sont gérés site par site — le premier et le dernier franchisé ne sont jamais relookés en même temps',
      'La tête de réseau n\'a souvent aucune visibilité sur l\'état visuel réel de chaque point de vente entre deux audits annuels',
      'Le coût de la communication visuelle varie du simple au triple entre deux franchisés selon leur zone géographique et leurs prestataires locaux',
      'L\'expansion internationale des réseaux franchisés est souvent freinée par la difficulté à maintenir les standards visuels hors de France'
    ],
    qs:[
      'Comment vous assurez-vous aujourd\'hui que chaque franchisé respecte la charte graphique lors d\'une ouverture ou d\'une rénovation ? Vous avez un process formalisé, un prestataire agréé, ou c\'est laissé à la discrétion du franchisé ?',
      'Quand un franchisé commande en dehors du circuit agréé et que vous le découvrez — enseigne non conforme, supports de mauvaise qualité — qu\'est-ce qui se passe concrètement ? Vous avez les moyens de corriger ça rapidement ?',
      'Sur votre dernier relook ou rebranding réseau, quel a été le délai entre le premier et le dernier site traité ? Et qu\'est-ce qui a le plus ralenti le déploiement ?',
      'Comment gérez-vous les franchisés en régions éloignées — les Outre-mer si applicable, les sites en Belgique, en Suisse ou en Espagne ? Le standard visuel est le même qu\'en France ?',
      'Si vous pouviez donner à chaque franchisé un outil pour commander directement les supports visuels — avec vos standards intégrés, sans que vous ayez à valider chaque commande — est-ce que ça vous soulagerait de quoi concrètement ?',
      'Quelle est votre principale source de non-conformité visuelle dans le réseau aujourd\'hui — mauvaise compréhension de la charte, prestataires locaux non formés, ou simplement une volonté de faire différemment ?',
      'Quand vous ouvrez un nouveau site, combien de temps prend la mise en conformité visuelle complète — de la signature du contrat à l\'enseigne posée ?'
    ],
    sig:[
      'Il parle de franchisés non conformes lors des audits visuels',
      'Il évoque des délais de relook réseau anormalement longs',
      'Il mentionne des coûts non maîtrisés par site selon la région',
      'Il parle d\'une expansion géographique en cours ou planifiée',
      'Il exprime de la frustration sur le temps passé à contrôler la conformité',
      'Il mentionne des franchisés récalcitrants à respecter les standards'
    ],
    scen:[
      {t:'yes',trig:'Il parle des franchisés non conformes avec précision',act:'Quantifier : "Sur vos X sites, combien estimez-vous non conformes aujourd\'hui ?" / "Ça représente quel risque d\'image pour la marque ?"',nx:'→ Phase 3 : Reformulation'},
      {t:'maybe',trig:'Il minimise les problèmes de conformité',act:'"Sur votre dernier audit visuel réseau — quel pourcentage de sites étaient entièrement conformes à la charte ?" Forcer le chiffre réel.',nx:'→ Continuer avec données d\'audit'},
      {t:'no',trig:'Dit que la conformité est parfaite',act:'"Dans ce cas, parlons des coûts. Est-ce que tous vos franchisés paient le même prix pour leurs supports visuels, ou il y a des écarts selon les régions ?" Angle coûts et équité tarifaire.',nx:'→ Pivot sur l\'angle coûts et équité entre franchisés'}
    ]
  },
  p3:{
    script:`"Si je comprends bien ce que vous m'avez décrit : votre principal défi c'est de garantir la cohérence visuelle sur l'ensemble de vos [X] sites, avec des franchisés qui ont des comportements différents selon leur région et leur ancienneté, sans outil centralisé pour piloter et contrôler ça au quotidien. Et sous tout ça, ce que vous voulez vraiment c'est reprendre le contrôle de l'image de marque avant votre prochain relook ou lancement — sans y consacrer plus de temps qu'aujourd'hui. C'est bien ça ?"`,
    cache:'Le franchiseur veut contrôler sans avoir à gérer. Il veut que les franchisés soient autonomes dans le cadre qu\'il définit — pas qu\'il doive valider chaque commande. Vendez la délégation maîtrisée : chacun est libre dans le périmètre que vous avez dessiné.',
    scen:[
      {t:'yes',trig:'Il confirme le besoin de contrôle sans surcharge',act:'Transition naturelle vers la plateforme et les arguments de centralisation.',nx:'→ Phase 4 : Argumentation CAP'},
      {t:'maybe',trig:'Il nuance — "le vrai problème c\'est les coûts, pas la conformité"',act:'"Compris. Les deux sont liés — mais on commence par les coûts si c\'est votre priorité numéro 1." Adapter l\'ordre des arguments.',nx:'→ Reformulation ajustée sur les coûts franchisés'},
      {t:'no',trig:'Dit que ce n\'est pas exactement ça',act:'"Dites-moi ce qui est inexact — je veux m\'assurer de bien comprendre avant de vous proposer quoi que ce soit."',nx:'→ Retour découverte ciblée → Nouvelle reformulation'}
    ]
  },
  p4:{
    args:[
      {
        c:'Catalogue réseau centralisé avec vos standards visuels intégrés — chaque franchisé commande en autonomie dans un cadre que vous avez validé',
        a:'Chaque franchisé accède à une boutique en ligne avec uniquement vos produits agréés — enseigne conforme, PLV aux bonnes couleurs, supports aux bons formats. Il commande en 3 clics, vous n\'avez rien à valider, et vous êtes certain qu\'il est conforme. La non-conformité par défaut disparaît — parce que le seul moyen de commander c\'est de rester dans la charte.',
        p:'Réseau franchisé retail — 80 franchisés équipés via la plateforme Vivagence, 100% de conformité charte constatée sur le dernier audit annuel. Premier audit zéro-défaut visuel de leur histoire.'
      },
      {

        a:'Le franchisé de Strasbourg paie exactement le même prix que celui de Paris ou de Bordeaux. Fin des surcoûts locaux qui créent de la frustration et poussent les franchisés à chercher des prestataires moins chers — et donc non conformes. L\'économie réalisée par chaque franchisé devient un argument pour adhérer au circuit agréé.',

{

  p0:{
    presComm:`"Bonjour [Prénom], je m'appelle [Prénom] chez Vivagence. Vivagence est une maison de fabrication — agence, imprimeur et poseur en un seul interlocuteur. Nous travaillons avec des maisons qui ont des exigences de finition très élevées : Pantone imposés, matériaux spécifiques, installations hors horaires d'ouverture avec discrétion absolue. Ce qui nous distingue, c'est qu'on ne fait aucun compromis sur la qualité, et qu'on signe un bon à tirer physique avant chaque production."`,
    qInterlo:`"Avant tout, pouvez-vous me dire qui chez vous est en charge de la validation des supports visuels physiques — votre équipe VM, le marketing central, ou une direction artistique depuis la maison mère ?"`,
    lienTerrain:`"Je pose la question parce que dans les maisons où le processus de validation est rigoureux — comme c'est le cas dans le luxe — le prestataire doit s'adapter à votre process, pas l'inverse. Je veux comprendre votre process avant de vous proposer quoi que ce soit."`,
    scen:[
      {t:'yes',trig:'Il décrit le process de validation avec précision',act:'Identifier les points de friction : délais de validation, multiplicité des intervenants, BAT physique ou digital. Adapter l\'approche en conséquence.',nx:'→ Phase 1 : Objet du jour'},

      {t:'no',trig:'Il dit que tout est géré par la maison mère à l\'étranger',act:'"Je comprends. Dans ce cas, pour les projets locaux que vous gérez en autonomie — corners en grands magasins, opérations saisonnières — comment ça se passe ?"',nx:'→ Angle projets locaux en autonomie'}

  },
  p1:{
    cadrage:`"Est-ce que vous pouvez m'accorder quelques minutes ? Je voudrais comprendre vos exigences et vos contraintes actuelles, vous me montrez ce qui vous pose problème, et on évalue ensemble honnêtement si notre niveau de service correspond à vos standards. Si ce n'est pas le cas, je préfère qu'on le sache maintenant plutôt qu'après."`,

    regle:`"Montrez-moi vos exigences les plus pointues — matières, Pantone, finitions, contraintes d'installation. C'est en vous entendant sur le plus difficile que je pourrai vous dire honnêtement si Vivagence est capable de vous servir à votre niveau."`,

  p2:{

    script:`"Si je résume : vous avez des exigences de finition et de conformité charte que peu de prestataires tiennent réellement sur le long terme, vos délais d'installation sont non négociables, et vous avez besoin d'équipes qui savent se comporter dans vos espaces clients avec la discrétion que ça exige. Et sous tout ça, ce que vous cherchez c'est un partenaire — quelqu'un en qui vous avez vraiment confiance pour ne pas vous mettre en défaut devant la maison mère ou devant vos équipes. C'est ça ?"`,

{

  p0:{
    presComm:`"Bonjour [Prénom], je m'appelle [Prénom] chez Vivagence. On est une agence de communication qui fabrique en interne — impression, PLV, signalétique trade. Ce qui nous distingue en Food & Beverage, c'est qu'on produit la PLV trade en cohérence colorimétrique directe avec le packaging — même profil ICC, même calibration. Et on déploie sur votre réseau GMS en J+2 sur les supports standards."`,
    qInterlo:`"Pour que je cible bien notre échange : vous intervenez principalement sur les lancements produit, les opérations trade marketing en GMS, ou les deux ?"`,
    lienTerrain:`"Je pose la question parce que les enjeux ne sont pas les mêmes selon le cas. Sur les lancements, c'est le délai et la cohérence visuelle avec le packaging qui comptent. Sur les opérations promotionnelles, c'est le déploiement réseau. Je veux m'assurer d'aborder ce qui vous concerne vraiment."`,
    scen:[

      {t:'maybe',trig:'Il est vague sur son périmètre',act:'"Sur votre dernière opération trade — c\'était un lancement ou une promo saisonnière ?" Forcer un cas concret pour qualifier.',nx:'→ Qualifier sur un cas concret'},
      {t:'no',trig:'Dit qu\'il gère tout en interne avec une agence dédiée',act:'"Je comprends. Est-ce que votre agence produit aussi la PLV physique — ou elle crée et vous cherchez un imprimeur séparément ?"',nx:'→ Qualifier la chaîne de production actuelle'}
    ]
  },
  p1:{
    cadrage:`"Est-ce que vous pouvez m'accorder quelques minutes ? Je voudrais comprendre vos enjeux trade actuels, vous me dites ce qui coince sur la production ou le déploiement, et je vous montre comment Vivagence peut raccourcir vos délais et simplifier votre organisation."`,
    accroche:`"Dans le F&B, un lancement c'est un chrono. Votre produit est référencé, la date de mise en rayon est fixée, et il vous faut la PLV qui va avec — cohérente avec le packaging, livrée à temps, sur tous les sites. Ce que j'observe souvent : un décalage de quelques jours entre le produit sur le linéaire et la PLV qui devrait l'animer. Ce décalage coûte des ventes au lancement."`,
    regle:`"Parlez-moi de votre dernier lancement ou opération — les délais réels, les problèmes de cohérence visuelle, les difficultés de déploiement. Plus vous êtes concret, plus ma réponse sera pertinente."`,
    oui1:'Accord pour quelques minutes d\'échange',

      {t:'maybe',trig:'Il a peu de temps',act:'Version accélérée : 2 questions clés seulement — délai et cohérence couleur. Aller directement aux arguments.',nx:'→ Découverte accélérée → Arguments principaux'},

  },
  p2:{
    ctx:[
      'Un lancement F&B implique des délais de production PLV souvent inférieurs à 3 semaines — entre la validation du BAT packaging et la date de mise en rayon, il ne reste parfois que 10 jours pour produire et déployer',
      'La cohérence colorimétrique entre packaging et PLV est critique et souvent ratée quand packaging et PLV sont produits par des prestataires différents — un décalage de couleur en rayon fragilise la reconnaissance de marque',

    qs:[
      'Sur votre dernier lancement produit, quel a été le délai réel entre la validation finale du BAT packaging et la première PLV posée en rayon ? Et dans ce délai, qu\'est-ce qui a pris le plus de temps ?',

      'Combien de références PLV différentes gérez-vous par an — ILV, stop-rayon, balisage de rayon, têtes de gondole, habillages réfrigérés ? Et combien de prestataires différents pour les produire ?',

      'Si vous pouviez avoir un seul prestataire pour la création PLV, la production et le déploiement réseau — cohérent avec votre packaging — qu\'est-ce que ça changerait dans votre organisation ?'

      {t:'maybe',trig:'Dit que les délais sont globalement tenus',act:'"Et la cohérence colorimétrique avec le packaging — sur 10, vous donnez quoi à votre PLV actuelle ?" Forcer une évaluation pour révéler les lacunes.',nx:'→ Continuer avec la qualité colorimétrique'},
      {t:'no',trig:'Dit qu\'il n\'a pas de problème particulier',act:'"Sur votre prochain lancement — la PLV sera produite par qui ? Et est-ce que vous êtes certain que la couleur correspondra exactement au packaging ?" Créer le doute sur un projet futur.',nx:'→ Pivot sur la prochaine opération'}

  p3:{
    script:`"Donc vous gérez [X lancements ou opérations par an] avec [Y prestataires], vous avez eu des problèmes de [cohérence couleur / délai / coordination] sur [telle opération récente], et ce que vous cherchez c'est un prestataire qui prend en charge la PLV en cohérence avec votre packaging — dans des délais compatibles avec vos dates de référencement — et qui peut déployer sur l'ensemble de votre réseau GMS. Et sous tout ça, ce que vous voulez vraiment c'est ne jamais être en retard par rapport à votre produit en rayon. C'est bien ça ?"`,
    cache:'Le chef de produit F&B craint surtout d\'être responsable d\'un rayon mal animé à la date de lancement. C\'est sa réputation interne et sa relation avec le distributeur qui sont en jeu. Vendez la fiabilité sur les délais et la cohérence visuelle — pas les prix.',
    scen:[
      {t:'yes',trig:'Il confirme les deux enjeux : délai et cohérence',act:'"Parfait. Sur ces deux points précis — les délais et la cohérence colorimétrique — voilà comment Vivagence répond concrètement."',nx:'→ Phase 4 : Argumentation CAP'},
      {t:'maybe',trig:'Nuance — "le délai surtout, la couleur c\'est secondaire"',act:'"Compris — on commence par les délais. Sur la couleur, je vous montrerai en pratique pourquoi c\'est plus important qu\'on ne le pense." Adapter l\'ordre des arguments.',nx:'→ Reformulation ajustée sur les délais → Phase 4'},
      {t:'no',trig:'Dit que ce n\'est pas exactement ça',act:'"Dites-moi ce qui est inexact — je veux être sûr d\'adresser votre vrai sujet."',nx:'→ Retour découverte ciblée'}

        p:'Delta E moyen entre packaging et PLV Vivagence : inférieur à 1 — c\'est le standard luxe appliqué au mass market. Sur toutes nos réalisations F&B en 2024, zéro réclamation distributeur sur la cohérence colorimétrique entre packaging et PLV.'

      {t:'maybe',trig:'Dit que son agence gère déjà la PLV',act:'"Votre agence crée — parfait. Et pour la production physique, elle imprime ou elle sous-traite ?" Qualifier si l\'agence produit vraiment ou sous-traite à un imprimeur.',nx:'→ Différenciation sur la production directe vs sous-traitance'},
      {t:'no',trig:'Dit que ses volumes sont trop importants pour Vivagence',act:'"Donnez-moi vos volumes annuels par famille de support, je vous reviens avec une capacité confirmée et un tarif volume dans les 24 heures."',nx:'→ Qualifier les volumes → Proposition tarifaire dédiée'}

      {

        r:'Creuser : "Votre agence gère aussi la production physique — elle imprime elle-même — ou elle sous-traite à un imprimeur ?" → Reformuler : "Donc votre agence crée et coordonne, mais la production physique est assurée par un prestataire qu\'elle choisit — et dont vous ne maîtrisez pas la chaîne colorimétrique ?" → Argumenter : "Gardez votre agence pour la création — c\'est votre relation commerciale. Vivagence prend le relais exactement à la sortie des fichiers. Votre agence nous envoie les fichiers, on produit avec nos standards colorimétriques, on livre à vos dates. Vous gardez votre process créa, vous gagnez sur la cohérence et les délais." → Contrôler : "Si votre agence continue la création et Vivagence prend la production — est-ce que ça vous convient ?"'

    tech:'Closing par le lancement à venir — devis immédiat sur le prochain projet',

{
  name:'Banques, Assurances & Mutuelles', color:'#1A237E',
  cible:'Directeur immobilier, directeur marketing réseau, responsable communication institutionnelle',
  duree:'45 min',
  p0:{
    presComm:`"Bonjour [Prénom], je m'appelle [Prénom] chez Vivagence. Vivagence est une agence de communication globale — fabricant, créateur et imprimeur en un seul interlocuteur. Ce qui nous distingue pour les réseaux bancaires et assurantiels, c'est notre capacité à déployer sur des centaines d'agences de manière coordonnée, avec un reporting de suivi que vous pouvez présenter à votre direction, et des installations réalisées exclusivement hors horaires d'ouverture."`,
    qInterlo:`"Pour que je cible bien notre échange : est-ce que vous intervenez plutôt sur la partie immobilière et rénovations d'agences, sur la communication visuelle et signalétique au sens large, ou sur les deux ?"`,
    lienTerrain:`"Je pose la question parce que les enjeux ne sont pas identiques selon le périmètre. Côté immobilier, c'est la coordination des travaux et le respect des délais d'ouverture. Côté communication, c'est la cohérence de la charte sur l'ensemble du réseau. Je veux m'assurer de répondre à votre sujet principal."`,
    scen:[
      {t:'yes',trig:'Il définit son périmètre clairement',act:'Adapter immédiatement. Immobilier → délais ouverture et coordination. Communication → cohérence charte et visibilité réseau.',nx:'→ Phase 1 : Objet du jour'},
      {t:'maybe',trig:'Il est vague sur son périmètre',act:'"Sur votre dernière rénovation d\'agence — qui coordonnait les prestataires visuels et la signalétique ?" Forcer un cas concret.',nx:'→ Qualifier l\'organisation interne'},
      {t:'no',trig:'Dit que ça n\'est pas son périmètre',act:'"Je comprends. Qui dans votre organisation prend en charge ce sujet — direction immobilière, direction marketing ?" Mapping de l\'organisation.',nx:'→ Identifier le bon interlocuteur'}
    ]
  },
  p1:{
    cadrage:`"Est-ce que vous pouvez m'accorder quelques minutes ? Je voudrais comprendre comment votre réseau gère son image aujourd'hui, vous me dites ce qui ne fonctionne pas assez bien, et je vous présente comment Vivagence travaille avec des réseaux similaires au vôtre."`,
    accroche:`"Dans les secteurs financiers, l'image est un vecteur de confiance direct. Une agence bancaire qui n'a pas été relookée depuis 8 ans, c'est un signal négatif pour le client — même si les services sont excellents. Ce que j'observe, c'est que les directions immobilières et marketing se coordonnent rarement bien sur ces sujets, et que les déploiements prennent beaucoup plus de temps que prévu."`,
    regle:`"Je vais vous poser des questions sur votre réseau et vos derniers projets — délais réels, incidents, coûts. Plus vous êtes précis, plus ma proposition sera pertinente et adaptée à votre réalité."`,
    oui1:'Accord pour quelques minutes d\'échange',
    oui2:'Accord pour partager les données réelles des déploiements',
    oui3:'Accord pour une conclusion avec une proposition concrète',
    resist:`"Je comprends. Puis-je juste vous envoyer le rapport d'un déploiement réseau similaire — délais, méthode, résultats ? Vous évaluez en 10 minutes si ça mérite un échange."`,
    scen:[
      {t:'yes',trig:'Il accepte et s\'ouvre sur les défis du réseau',act:'Lancer avec : "Si vous deviez noter l\'état visuel actuel de votre réseau de 1 à 10 en cohérence de charte — vous diriez quoi ?"',nx:'→ Phase 2 : Découverte'},
      {t:'maybe',trig:'Il est prudent ou sur la défensive',act:'"Je ne viens pas critiquer ce qui est fait. Je viens vous montrer comment d\'autres réseaux similaires ont simplifié leur gestion visuelle et réduit leurs délais de déploiement."',nx:'→ Approche benchmarks sectoriels'},
      {t:'no',trig:'Dit que le réseau est bien géré',act:'"Excellent. Alors parlons de la charge que ça représente. Combien de personnes chez vous consacrent du temps à la coordination des prestataires visuels sur une rénovation d\'agence ?"',nx:'→ Angle charge et efficacité opérationnelle'}
    ]
  },
  p2:{
    ctx:[
      'Les réseaux bancaires comptent entre 100 et 800 agences avec des états visuels très hétérogènes — les dernières rénovées brillent, les plus anciennes tirent l\'image de la marque vers le bas',
      'La direction immobilière gère les rénovations structurelles, mais la direction marketing gère la charte visuelle — ces deux directions se coordonnent rarement bien et les délais s\'allongent',
      'Les processus de validation interne (direction artistique, service juridique, conformité réglementaire) allongent considérablement les délais de déploiement',
      'L\'installation en espace client bancaire impose une discrétion totale et des travaux exclusivement hors heures d\'ouverture — contrainte que peu de prestataires généralistes maîtrisent',
      'Les obligations réglementaires (mentions légales obligatoires, formats conformes AMF/ACPR pour certains supports) ajoutent une couche de complexité que les prestataires non spécialisés ne maîtrisent pas'
    ],
    qs:[
      'Si vous deviez noter l\'état visuel actuel de votre réseau de 1 à 10 en cohérence de charte graphique — en étant honnête sur les agences les moins récentes — vous diriez quoi ? Et qu\'est-ce qui vous empêche d\'atteindre 10 ?',
      'Sur votre dernier relook ou rebranding réseau, quel a été le délai entre la première agence relookée et la dernière ? Et qu\'est-ce qui a le plus ralenti le déploiement — les validations internes, la logistique, les prestataires, autre chose ?',
      'Comment coordonnez-vous aujourd\'hui entre la direction immobilière, la direction marketing et les prestataires externes pour une rénovation d\'agence ? Qui est le chef d\'orchestre, et est-ce que ça crée des frictions ?',
      'Quand vous lancez une nouvelle offre avec une signalétique dédiée, combien de temps s\'écoule entre la validation des visuels et la mise en place dans toutes les agences du réseau ? Et ça vous satisfait ?',
      'Avez-vous eu des incidents lors d\'installations en agence — bruit pendant les heures d\'ouverture, désordre dans l\'espace client, retard sur l\'ouverture du lendemain ? Comment avez-vous géré ça ?',

    presComm:`"Bonjour [Prénom], je m'appelle [Prénom] chez Vivagence. On est une agence de communication globale — fabricant et imprimeur — avec une expertise spécifique en signalétique industrielle : supports normés ISO pour la sécurité, matériaux résistants aux environnements difficiles, et un audit gratuit de conformité de votre signalétique existante. On travaille régulièrement avec des directeurs de site qui ont un contrôle ou une mise à jour réglementaire à gérer."`,

    lienTerrain:`"Je pose la question parce que la responsabilité légale sur la signalétique de sécurité repose sur le directeur de site — même quand le sujet est géré opérationnellement par quelqu'un d'autre. En cas de contrôle, c'est votre responsabilité personnelle qui est engagée. Je veux m'assurer de parler à la bonne personne."`,

      {t:'maybe',trig:'Il dit que c\'est géré par la HSE ou les achats',act:'"Je comprends. Et si demain vous aviez une inspection du travail ou une visite DREAL — qui répond aux questions sur la conformité de la signalétique ?" Remettre la responsabilité sur le directeur de site.',nx:'→ Qualifier la responsabilité réelle'},

  p1:{
    cadrage:`"Est-ce que vous pouvez m'accorder quelques minutes ? Je voudrais comprendre l'état actuel de votre signalétique, vos contraintes réglementaires, et voir si un audit gratuit sur votre site a du sens pour vous. Si vous êtes déjà parfaitement couverts, je vous le dirai franchement."`,

    regle:`"Parlez-moi franchement de l'état de votre signalétique — les zones à problèmes, les supports dégradés, les derniers retours d'inspection. Plus vous êtes précis, plus mon audit pourra cibler les vrais risques."`,

        r:'Creuser : "Votre service maintenance est-il formé aux normes ISO de sécurité — ISO 7010, NF EN 1838 — et fait-il une veille sur les évolutions normatives ?" → Reformuler : "Donc votre maintenance assure le remplacement des supports abîmés, mais la conformité normative et la veille réglementaire sont moins couverts ?" → Argumenter : "C\'est une distinction importante. Votre service maintenance est excellent sur l\'opérationnel — remplacement, entretien. Mais la conformité normative, c\'est un métier à part entière. On prend ce poste spécifique pour eux — audit de conformité, production aux normes, mise à jour réglementaire — et votre maintenance se concentre sur ce qu\'elle fait vraiment bien." → Contrôler : "Cette distinction entre maintenance opérationnelle et conformité normative — est-ce que ça vous parle ?"'
      },
      {
        o:'La signalétique, ce n\'est pas un budget prioritaire dans notre plan d\'investissement.',
        r:'Creuser : "C\'est une question de priorité budgétaire, ou est-ce que vous sous-estimez le risque réglementaire lié à une non-conformité ?" → Reformuler : "Vous gérez beaucoup de priorités, et la signalétique ne remonte pas en haut de la liste parce qu\'elle ne crée pas de problème visible — jusqu\'à un contrôle ?" → Argumenter : "Je comprends parfaitement. Voici la question à se poser : quel est le coût d\'une mise en demeure DREAL ou d\'une suspension partielle d\'activité par rapport au coût d\'une mise en conformité préventive ? Dans 100% des cas que j\'ai vus, la mise en conformité préventive est 10 à 50 fois moins chère. Et l\'audit pour le savoir est gratuit." → Contrôler : "Avec cet angle de risque/coût — est-ce que la signalétique remonte dans vos priorités ?"'
      },
      {
        o:'On est dans une zone difficile d\'accès — vous pourrez vraiment vous déplacer ?',
        r:'Creuser : "Vous êtes à quelle distance de votre ville la plus proche ? Et avez-vous des contraintes d\'accès spécifiques — zone SEVESO, accréditation nécessaire ?" → Reformuler : "Votre principale crainte c\'est que l\'éloignement génère des surcoûts ou des délais que vous ne pouvez pas absorber ?" → Argumenter : "Nos équipes se déplacent sur toute la France — et au-delà sur demande. Pour les sites éloignés, on planifie la logistique à l\'avance et on regroupe l\'audit et l\'installation en une seule intervention. L\'éloignement ne change rien au délai ni au prix — c\'est intégré dans nos tarifs dès le devis." → Contrôler : "Avec un déplacement planifié intégrant l\'audit et l\'installation en une seule visite — est-ce que l\'éloignement reste un obstacle ?"'
      },
      {
        o:'Nos normes internes groupe sont différentes des normes ISO standard.',
        r:'Creuser : "Vos normes internes groupe sont plus exigeantes que les normes ISO — ou simplement différentes dans la forme ?" → Reformuler : "Vous avez une double conformité à respecter — normes réglementaires et charte groupe — et vous voulez vous assurer qu\'on peut gérer les deux simultanément ?" → Argumenter : "On travaille régulièrement avec des groupes qui ont leurs propres standards HSE ou chartes visuelles en plus des normes légales. Envoyez-nous vos spécifications internes et le référentiel groupe — on intègre la double conformité dans notre production. Un seul audit, un seul livrable conforme aux deux niveaux d\'exigence." → Contrôler : "Si on vous garantit la double conformité normes réglementaires + charte groupe — est-ce que ça répond à votre contrainte ?"'
      }
    ]
  },

{
  name:'Grands Comptes — ETI, CAC40, Groupes Internationaux', color:'#0D47A1',
  cible:'Directeur marketing groupe, directeur des achats, directeur communication, DG dans les ETI',
  duree:'60 min',
  p0:{
    presComm:`"Bonjour [Prénom], je m'appelle [Prénom], je suis directeur de compte chez Vivagence. Vivagence est une agence de communication globale — fabricant, créateur et imprimeur, tout en interne. Ce qui intéresse les groupes de votre taille, c'est notre capacité à consolider la communication visuelle sur l'ensemble de vos entités — France, Espagne, zone euro — en un seul contrat, une seule facture mensuelle consolidée, et un account manager dédié qui connaît votre groupe. En résumé, on remplace 8 à 15 prestataires par 1."`,
    qInterlo:`"Avant d'aller plus loin, comment est organisée aujourd'hui la décision sur les achats de communication visuelle dans votre groupe — est-ce que c'est centralisé depuis le marketing ou les achats groupe, ou chaque direction business unit achète de son côté ?"`,
    lienTerrain:`"Je pose la question parce que selon l'organisation, la dépense réelle du groupe sur ce poste est souvent inconnue — et c'est précisément là où il y a le plus de valeur à récupérer. Je veux comprendre votre situation avant de vous proposer quoi que ce soit."`,
    scen:[
      {t:'yes',trig:'Il décrit une organisation centralisée ou en cours de centralisation',act:'Identifier l\'état de maturité des achats groupe sur ce poste. Centralisation récente = opportunité d\'être le premier partenaire structuré.',nx:'→ Phase 1 : Objet du jour'},
      {t:'maybe',trig:'Il est vague — "c\'est un peu les deux"',act:'"Dans les faits, qui a signé le dernier grand contrat de communication visuelle — marketing central, achats groupe, ou une BU ?" Forcer le cas concret pour qualifier.',nx:'→ Qualifier le mode de décision réel'},
      {t:'no',trig:'Dit qu\'il n\'est pas le bon interlocuteur',act:'"Je comprends. Qui dans votre groupe a la vision la plus complète des dépenses de communication visuelle — entre les achats, le marketing et les BU ?" Mapping de l\'organisation pour trouver l\'interlocuteur clé.',nx:'→ Mapping organisation → Identifier le décideur ou influenceur principal'}
    ]
  },
  p1:{
    cadrage:`"Est-ce que vous pouvez m'accorder quelques minutes ? Je voudrais comprendre comment votre groupe gère ses achats communication visuelle et ce que ça représente réellement, vous me dites ce qui ne fonctionne pas, et je vous présente comment Vivagence peut simplifier et économiser. Si au bout de quelques minutes il n'y a pas d'intérêt, je serai le premier à le dire."`,
    accroche:`"Ce que j'observe dans les groupes de votre taille, c'est que la dépense annuelle en communication visuelle — enseignes, PLV, signalétique, habillages événementiels — est souvent entre 800 000€ et 3M€ par an, mais personne dans le groupe ne connaît le chiffre exact. Et quand on fait l'inventaire des prestataires, on en trouve entre 8 et 15 selon les pays et les directions. Ma question directe : est-ce votre cas ?"`,
    regle:`"Je vais vous poser des questions sur vos dépenses réelles et votre organisation achats — même si les chiffres sont approximatifs. Plus vous me donnez de données précises, plus ma proposition sera concrète et chiffrée."`,
    oui1:'Accord pour quelques minutes d\'échange',
    oui2:'Accord pour partager les données d\'organisation achats du groupe',
    oui3:'Accord pour une proposition chiffrée en fin d\'entretien si pertinent',
    resist:`"Je comprends votre temps est précieux. Puis-je vous envoyer une simulation de ROI basée sur des groupes comparables au vôtre — 15 minutes de lecture et vous avez un premier ordre de grandeur sur ce qu'on pourrait économiser ensemble ?"`,
    scen:[
      {t:'yes',trig:'Il accepte et semble intéressé par la consolidation',act:'Lancer directement : "Si je vous demande combien votre groupe dépense en communication visuelle sur l\'année — tous prestataires confondus — vous pouvez me donner un chiffre approximatif ?"',nx:'→ Phase 2 : Découverte'},
      {t:'maybe',trig:'Il est sceptique — "on a déjà eu des propositions similaires"',act:'"Je comprends votre scepticisme — on vous vend souvent des économies qui ne se matérialisent pas. Voici ce que je vous propose : donnez-moi 3 factures de vos prestataires actuels, et je vous montre chiffres à l\'appui ce qu\'on économise réellement. Pas de promesse — des faits."',nx:'→ Proposition de simulation ROI sur données réelles'},
      {t:'no',trig:'N\'a pas de visibilité sur ce poste de dépense',act:'"C\'est précisément ça le sujet. Je peux vous aider à avoir cette visibilité pour la première fois. L\'inventaire des prestataires et la consolidation de la dépense, c\'est la première étape qu\'on fait ensemble — gratuitement."',nx:'→ Proposer un inventaire prestataires gratuit → Découverte'}
    ]
  },
  p2:{
    ctx:[
      'Un grand compte de 500 à 5000 personnes génère en moyenne entre 800 000 et 3M€ de dépenses annuelles en communication visuelle — souvent non consolidées et non connues de la direction',
      'Ces dépenses sont réparties entre 8 et 15 prestataires différents selon les pays, les directions business et les types de supports — chacun avec ses propres tarifs, ses délais et son niveau de service',
      'Personne dans le groupe n\'a de vision consolidée de ce que représente cette dépense totale — les achats ne la suivent pas en tant que poste dédié, le marketing ne consolide pas ses commandes',
      'Les délais, les standards de qualité et les niveaux de cohérence visuelle sont hétérogènes selon les entités — un groupe peut avoir une image parfaite à Paris et très dégradée dans ses entités régionales ou internationales',
      'L\'absence de politique d\'achat centralisée sur ce poste génère des surcoûts de 25 à 40% par rapport à ce que donnerait un accord-cadre groupe négocié sur les volumes consolidés'
    ],
    qs:[
      'Si je vous demande combien votre groupe dépense en communication visuelle sur l\'année — enseignes, PLV, signalétique, habillages événementiels, tous prestataires confondus — vous pouvez me donner un chiffre approximatif ? Ou personne n\'a cette vision consolidée ?',
      'Combien de prestataires différents gèrent cette dépense au niveau groupe — vous avez une idée ? Et y a-t-il une politique d\'achats centralisée sur ce poste, ou chaque direction est libre de choisir ses fournisseurs ?',
      'Quelles directions ont le plus de liberté pour choisir leurs propres fournisseurs de communication visuelle — les BU, les directions régionales, les entités internationales ? Est-ce que ça génère des problèmes de cohérence de marque ?',
      'Avez-vous mené une consultation ou un appel d\'offres sur ce poste de dépense dans les 3 dernières années ? Si non, pourquoi — manque de temps, pas de pilote pour le projet, trop complexe ?',

      'Combien de temps vos équipes achats ou marketing consacrent-elles à la gestion des prestataires de communication visuelle — contractualisation, relances, validation de factures ? Vous avez un chiffre même approximatif ?',
      'Si on pouvait vous économiser 20 à 30% sur ce poste avec un meilleur niveau de service et une visibilité complète — qu\'est-ce qu\'il faudrait pour que ça avance rapidement dans votre organisation ?'
    ],
    sig:[

    ],
    scen:[
      {t:'yes',trig:'Il reconnaît l\'absence de vision consolidée',act:'Quantifier l\'enjeu : "Si on estime que votre groupe est à 1,5M€/an de dépenses com visuelle non consolidées, une économie de 25% représente 375 000€ par an. Ça mérite qu\'on creuse ?" Mettre un chiffre sur la valeur.',nx:'→ Phase 3 : Reformulation'},
      {t:'maybe',trig:'Il dit que la dépense est maîtrisée via les achats',act:'"Les achats suivent ce poste de façon détaillée — par entité, par type de support, par prestataire ?" Forcer la vérité sur le niveau de granularité réel.',nx:'→ Qualifier la maturité du suivi achats'},
      {t:'no',trig:'Dit que ce n\'est pas un sujet pour lui',act:'"Je comprends. Qui dans votre organisation aurait la meilleure vision de ce sujet — quelqu\'un aux achats indirects, au marketing groupe ?" Chercher le bon interlocuteur.',nx:'→ Mapping vers le bon interlocuteur → Introduction chaleureuse'}
    ]
  },
  p3:{
    script:`"Si je résume ce que vous m'avez décrit : votre groupe dépense entre [X et Y]€ par an en communication visuelle, répartis entre [Z prestataires] sans vision consolidée ni politique achats uniforme. Le résultat : des coûts variables selon les entités, une cohérence de marque aléatoire, et des équipes qui consomment du temps à gérer des prestataires plutôt qu'à piloter votre stratégie. Et ce que vous cherchez, c'est simplifier, contrôler et économiser — sans que ça devienne un projet à temps plein pour vos équipes. C'est bien ça ?"`,
    cache:'Le directeur achats veut des économies mesurables et un seul dossier fournisseur à gérer. Le directeur marketing veut de la cohérence de marque et un niveau de service. Adressez les deux avec des arguments distincts — et impliquez les deux dans le processus de décision.',
    scen:[

      {t:'maybe',trig:'Il nuance — "les économies surtout"',act:'"Compris. On commence par les économies — la cohérence de marque, vous verrez que c\'est un bénéfice qui vient naturellement en prime."',nx:'→ Reformulation ajustée sur les économies'},
      {t:'no',trig:'Dit que ce n\'est pas aussi simple dans leur organisation',act:'"Je comprends la complexité organisationnelle — c\'est souvent ça le frein principal dans les grands groupes. Dites-moi ce qui est le plus difficile à changer chez vous, et je vous montre comment d\'autres groupes similaires ont contourné ça."',nx:'→ Découverte des freins organisationnels → Adapter la proposition'}

  p4:{

        p:'Grand compte retail — consolidation de 11 prestataires différents en 1 accord-cadre Vivagence : économie de 28% sur le coût total dès l\'an 1, temps achats réduit de 60%, zéro incident de non-conformité charte sur la première année.'
      },
      {

        p:'NPS moyen de nos comptes grands groupes : 72. Taux de rétention à 3 ans : 94%. Ce n\'est pas parce qu\'on est parfait — c\'est parce que nos clients n\'ont jamais à recommencer à zéro avec un nouveau prestataire.'

        a:'Vos entités espagnoles, belges et suisses bénéficient exactement du même niveau de service que vos entités françaises. Même qualité, même délai, même cohérence visuelle — quel que soit le pays. Et les tarifs groupe s\'appliquent partout, sans surprime internationale.',
        p:'3 groupes internationaux déployés en 2024 sur France + Espagne simultanément. Zéro différence de qualité ou de délai entre les deux pays. Un seul interlocuteur pour toutes les entités, un seul rapport mensuel consolidé pour la direction.'

    scen:[

      {t:'maybe',trig:'Dit que leurs entités locales résisteront',act:'"C\'est le frein le plus fréquent. Ce qui fonctionne : migration progressive — les nouvelles commandes passent par Vivagence, les prestataires existants maintiennent les projets en cours. En 12 à 18 mois, la consolidation se fait naturellement sans friction."',nx:'→ Proposer le modèle de migration progressive'},
      {t:'no',trig:'Dit qu\'ils ont déjà une politique achats solide',act:'"Dans ce cas, parlons de la zone internationale où cette politique achats s\'applique moins bien. Quel est l\'état de votre dépense et de votre cohérence visuelle en Espagne ou en Belgique ?"',nx:'→ Angle international ou entités non couvertes par la politique achats'}

  p5:{

      {
        o:'On a un appel d\'offres groupes — vous devrez y participer formellement.',
        r:'Creuser : "Quand est-ce que cet appel d\'offres est prévu — et quel est le périmètre couvert : France uniquement, zone euro, tous types de supports ?" → Reformuler : "Vous avez un processus formel en cours — et vous voulez vous assurer que Vivagence peut répondre à ce niveau d\'exigence ?" → Argumenter : "Absolument — on est organisés pour les appels d\'offres grands comptes. On a les dossiers de qualification, les références sectorielles et les capacités financières qui correspondent. Envoyez-moi le cahier des charges dès qu\'il est disponible. En attendant, je vous propose une présentation de notre dispositif pour que vous puissiez qualifier Vivagence correctement dans votre dossier." → Contrôler : "Une présentation complète pour qualifier Vivagence avant l\'appel d\'offres — est-ce que ça vous serait utile ?"'

      {
        o:'Un seul fournisseur, c\'est un risque de dépendance qu\'on ne peut pas prendre.',

      }
    ]

  p6:{

    tech:'Closing par la simulation ROI et la réunion direction — légitimer l\'entrée dans un processus formel',
    script:`"Je vous propose deux actions en parallèle cette semaine : une simulation ROI sur vos données réelles — donnez-moi 3 factures de prestataires actuels, je vous montre ce qu'on économise concrètement — et une réunion avec notre directeur des opérations pour toutes les questions techniques et de capacité internationale. À l'issue de ces deux actions, vous avez tous les éléments pour une décision éclairée ou pour qualifier Vivagence dans votre prochaine consultation. On planifie ça ?"`,

// Étape 1 — enrichir le script brut en monologue naturel
async function polishScript(rawScript) {
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      model: 'claude-sonnet-4-20250514',
      max_tokens: 450,
      system: `Tu es un commercial B2B français senior, expert en vente téléphonique. 
Tu réécris des scripts de vente pour qu'ils sonnent exactement comme un vrai appel professionnel.

RÈGLES ABSOLUES :
1. Supprime TOUTES les didascalies [entre crochets] et les intitulés de phase
2. Commence directement par la prise de parole, sans préambule
3. Phrases courtes, rythmées, naturelles — comme on parle vraiment
4. Ton professionnel mais humain, chaleureux et confiant, jamais robotique
5. Utilise des connecteurs naturels : "En fait,", "Concrètement,", "Ce qui est intéressant,", "Du coup,"
6. Ajoute une respiration naturelle après les questions (ponctuation claire)
7. Exactement 120 à 150 mots — ni plus, ni moins
8. Dernière phrase : question ouverte ou invitation directe à l'action
9. Pas de guillemets autour du texte, pas de tirets en liste — du texte continu
10. Vouvoiement systématique et professionnel`,
      messages: [{
        role: 'user',
        content: `Réécris ce script en monologue téléphonique naturel de 120-150 mots :\n\n${rawScript}`
      }]
    })
  });
  if (!res.ok) throw new Error(`API error ${res.status}`);
  const data = await res.json();
  const text = data.content?.[0]?.text || rawScript;
  // Nettoyer les éventuels résidus
  return text
    .replace(/\[.*?\]/g, '')
    .replace(/^\s*["«]/,'')
    .replace(/["»]\s*$/,'')
    .trim();
}

// Étape 2 — synthèse vocale via Anthropic TTS (modèle natif)
async function synthesizeSpeech(text) {
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      model: 'claude-sonnet-4-20250514',
      max_tokens: 1024,
      messages: [{
        role: 'user',
        content: text
      }],
      tools: [{
        type: 'computer_20241022',
        name: 'computer',
        display_width_px: 1,
        display_height_px: 1
      }],
      // TTS via content type audio
      system: 'Réponds uniquement en audio. Tu es un commercial français au téléphone.'
    })
  });
  // Fallback si TTS non dispo : retourner null pour passer au Web Speech
  if (!res.ok) return null;
  const data = await res.json();
  const audioBlock = data.content?.find(b => b.type === 'audio' || b.type === 'tool_result');
  if (audioBlock?.data) {
    const binary = atob(audioBlock.data);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    return URL.createObjectURL(new Blob([bytes], { type: 'audio/mpeg' }));
  }
  return null;
}

// Fallback — Web Speech API optimisé voix française
function speakWithBrowser(text, key, onEnd) {
  if (!('speechSynthesis' in window)) return false;
  window.speechSynthesis.cancel();

  // Nettoyer et normaliser le texte
  const clean = text
    .replace(/\*\*/g, '')
    .replace(/\*/g, '')
    .replace(/#{1,3} /g, '')
    .replace(/\n\n/g, '. ')
    .replace(/\n/g, ', ')
    .trim();

  // Découper en phrases pour éviter la coupure Chrome (limite ~200 chars)
  const sentences = clean.match(/[^.!?…]+[.!?…]+\s*/g) || [clean];

  // Grouper en chunks de max 180 chars
  const chunks = [];
  let current = '';
  for (const s of sentences) {
    if ((current + s).length > 180 && current.length > 0) {
      chunks.push(current.trim());
      current = s;
    } else {
      current += s;
    }
  }
  if (current.trim()) chunks.push(current.trim());
  if (!chunks.length) chunks.push(clean);

  let chunkIdx = 0;
  let stopped = false;

  const speakNext = () => {
    if (stopped || chunkIdx >= chunks.length) {
      if (!stopped) onEnd();
      return;
    }

    const utt = new SpeechSynthesisUtterance(chunks[chunkIdx]);
    utt.lang = 'fr-FR';
    utt.rate = 0.87;    // plus lent = plus naturel et professionnel
    utt.pitch = 1.06;   // légèrement chaleureux
    utt.volume = 1.0;

    // Sélection de voix française — ordre de préférence
    const voices = window.speechSynthesis.getVoices();
    const preferredNames = [
      'Thomas',           // macOS — voix masculine française naturelle
      'Amelie',           // macOS canadien-français
      'Aurelie',          // macOS
      'Virginie',         // macOS
      'Google français',  // Chrome
      'Microsoft Paul Online (Natural)',   // Edge
      'Microsoft Hortense Online (Natural)',
      'Microsoft Paul',
      'Microsoft Hortense',
    ];

    let voice = null;
    for (const name of preferredNames) {
      voice = voices.find(v => v.name.includes(name));
      if (voice) break;
    }
    // Fallback : n'importe quelle voix fr-FR
    if (!voice) voice = voices.find(v => v.lang === 'fr-FR');
    // Dernier recours : fr-CA ou fr-BE
    if (!voice) voice = voices.find(v => v.lang.startsWith('fr'));
    if (voice) utt.voice = voice;

    utt.onend = () => {
      chunkIdx++;
      // Petite pause entre les phrases pour le naturel
      if (chunkIdx < chunks.length) {
        setTimeout(speakNext, 80);
      } else {
        onEnd();
      }
    };
    utt.onerror = (e) => {
      if (e.error !== 'interrupted') { chunkIdx++; setTimeout(speakNext, 50); }
    };

    window.speechSynthesis.speak(utt);
  };

  // Workaround bug Chrome : keepalive avec setInterval
  const keepAlive = setInterval(() => {
    if (window.speechSynthesis.speaking) {
      window.speechSynthesis.pause();
      window.speechSynthesis.resume();
    } else {
      clearInterval(keepAlive);
    }
  }, 10000);

  speakNext();

  // Stocker le cleanup
  window._speechCleanup = () => {
    stopped = true;
    clearInterval(keepAlive);
    window.speechSynthesis.cancel();
  };

  return true;
}

  statusEl.textContent = "L'IA rédige le script commercial…";

  const rawScript = AUDIO_SCRIPTS[sIdx]?.[pIdx] || 'Script non disponible.';

  let polished = rawScript;
  let audioUrl = null;

  try {
    // Phase 1 — enrichissement du script
    statusEl.textContent = "Optimisation du script par l'IA…";
    polished = await polishScript(rawScript);
  } catch(e) {
    console.warn('Script polish failed, using raw:', e);
    polished = rawScript.replace(/\[.*?\]/g, '').trim();
  }

  // Afficher le script pendant la lecture
  showScript(polished, playerWrap);

  // Phase 2 — TTS : essayer d'abord le Web Speech API optimisé
  btn.textContent = '⏳ Synthèse…';
  statusEl.textContent = "Synthèse vocale en cours…";

  if (waveEl) waveEl.classList.add('playing');
  btn.disabled = false;
  btn.textContent = '⏹ Arrêter';
  btn.onclick = () => stopAllAudio(key);

  const ok = speakWithBrowser(polished, key, () => {
    stopAudioUI(key);
  });

  if (!ok) {
    statusEl.textContent = "Synthèse vocale non disponible — script affiché ci-dessous.";
    stopAudioUI(key);
  } else {
    statusEl.textContent = "Lecture en cours — appel commercial IA…";
  }
}

function playBlobAudio(url, key, statusEl, waveEl, btn, playerWrap) {
  stopAllAudio();
  if (waveEl) waveEl.classList.add('playing');
  statusEl.textContent = 'Lecture en cours…';
  btn.disabled = false;
  btn.textContent = '⏹ Arrêter';
  btn.onclick = () => stopAllAudio(key);
  const audio = new Audio(url);
  audio.onended = () => stopAudioUI(key);
  audio.onerror = () => stopAudioUI(key);
  audio.play();
  currentAudio = audio;
}

function showScript(text, playerWrap) {
  if (!playerWrap) return;
  playerWrap.innerHTML = `
    <div style="background:#222;border-radius:4px;padding:12px 14px;margin-top:10px;border-left:3px solid #E8621A">
      <div style="font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:rgba(255,255,255,0.3);margin-bottom:7px">
        Script enrichi par l'IA · Commercial Vivagence
      </div>
      <p style="font-size:12px;line-height:1.8;color:rgba(255,255,255,0.82);font-style:italic">${text}</p>
    </div>`;
}

function stopAllAudio(key) {
  if (window._speechCleanup) { window._speechCleanup(); window._speechCleanup = null; }
  if ('speechSynthesis' in window) window.speechSynthesis.cancel();
  if (currentAudio) { currentAudio.pause(); currentAudio = null; }
  if (key) stopAudioUI(key);
}

function stopAudioUI(key) {
  const waveEl = document.getElementById(`awave-${key}`);
  const btn    = document.getElementById(`abtn-${key}`);
  const statusEl = document.getElementById(`ast-${key}`);
  if (waveEl) waveEl.classList.remove('playing');
  if (statusEl) statusEl.textContent = 'Démo vocale IA — cliquez pour rejouer.';
  if (btn) {
    btn.disabled = false;
    btn.textContent = '▶ Rejouer';
    btn.onclick = () => generateAudio(curSector, curPhase);
  }
}

  <!-- RÈGLES D'OR -->
  <div class="g-section">
    <div class="g-section-title">⭐ Les 12 Règles d'Or du Commercial Vivagence</div>
    <div class="g-rules">
      <div class="g-rule"><div class="g-rule-n">1</div><div class="g-rule-text"><strong>Écouter avant de vendre</strong>Ne jamais présenter Vivagence avant d'avoir compris le vrai problème du prospect. La phase de découverte est sacrée.</div></div>
      <div class="g-rule"><div class="g-rule-n">2</div><div class="g-rule-text"><strong>Toujours demander quelques minutes</strong>Jamais de durée précise en phase d'entrée. "Quelques minutes" ouvre la porte. Un chiffre la ferme.</div></div>
      <div class="g-rule"><div class="g-rule-n">3</div><div class="g-rule-text"><strong>Reformuler avant d'argumenter</strong>Obtenir le OUI de validation avant chaque argument. Si le prospect n'a pas confirmé son besoin, l'argument ne sert à rien.</div></div>
      <div class="g-rule"><div class="g-rule-n">4</div><div class="g-rule-text"><strong>CRAC sur chaque objection</strong>Creuser → Reformuler → Argumenter → Contrôler. Ne jamais répondre directement à une objection sans d'abord la creuser.</div></div>
      <div class="g-rule"><div class="g-rule-n">5</div><div class="g-rule-text"><strong>Finir chaque entretien avec un next step daté</strong>Un entretien sans next step précis et daté est un entretien perdu. La date doit être fixée avant de raccrocher.</div></div>
      <div class="g-rule"><div class="g-rule-n">6</div><div class="g-rule-text"><strong>Proposer le projet pilote, pas le contrat</strong>L'entrée la plus facile est toujours un projet test sans engagement. Ne jamais demander un engagement global sur la première commande.</div></div>
      <div class="g-rule"><div class="g-rule-n">7</div><div class="g-rule-text"><strong>Ne jamais attaquer le concurrent actuel</strong>Poser des questions sur ses capacités réelles. Laisser le prospect découvrir lui-même les lacunes. L'attaque directe fait défendre.</div></div>
      <div class="g-rule"><div class="g-rule-n">8</div><div class="g-rule-text"><strong>Confirmer par email dans les 5 minutes</strong>Chaque engagement verbal doit être confirmé par écrit dans les 5 minutes. Ce qui n'est pas écrit n'existe pas.</div></div>
      <div class="g-rule"><div class="g-rule-n">9</div><div class="g-rule-text"><strong>Adapter le discours au rôle de l'interlocuteur</strong>Achats → économies et consolidation. Marketing → cohérence et image. Direction → ROI et simplicité. Même produit, 3 pitchs différents.</div></div>
      <div class="g-rule"><div class="g-rule-n">10</div><div class="g-rule-text"><strong>Quantifier chaque douleur</strong>"Combien de fois par an ?" / "Combien ça vous coûte ?" / "Combien d'heures par mois ?" Sans chiffre, la douleur reste abstraite.</div></div>
      <div class="g-rule"><div class="g-rule-n">11</div><div class="g-rule-text"><strong>Vendre la sérénité, pas les supports</strong>Le prospect n'achète pas des bâches — il achète la tranquillité d'esprit. Identifier le bénéfice émotionnel derrière le besoin rationnel.</div></div>
      <div class="g-rule"><div class="g-rule-n">12</div><div class="g-rule-text"><strong>Le devis dans les 48 heures, toujours</strong>Un devis livré en retard signale que l'exécution sera en retard. Le délai de devis est votre première promesse. Tenez-la.</div></div>
    </div>
  </div>

let voicesReady = false;
function preloadVoices() {
  if (!('speechSynthesis' in window)) return;
  const v = window.speechSynthesis.getVoices();
  if (v.length > 0) { voicesReady = true; return; }
  window.speechSynthesis.onvoiceschanged = () => {
    voicesReady = true;
    window.speechSynthesis.getVoices(); // force cache
  };
}
